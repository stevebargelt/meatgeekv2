# Device path items (HAR-20 / MG-80).
#
# Implementation status — all four operations are implemented:
#   - devices-collection GET  : apps/api/src/functions/devices/get-devices.ts
#   - devices-collection POST : apps/api/src/functions/devices/register-device.ts
#   - device-item GET         : apps/api/src/functions/devices/get-device.ts
#   - device-item PATCH       : apps/api/src/functions/devices/update-device.ts
#
# Identity comes only from the Easy Auth principal (X-MS-CLIENT-PRINCIPAL).
# There is no userId query parameter or x-user-id header: a device's owner is
# the authenticated caller. GET /devices wraps the array in {devices: [...]};
# the item routes return bare Device objects.
#
# Every response that reached Cosmos carries x-meatgeek-request-charge (HAR-11).
# A 401 or 400 is answered before any Cosmos call and carries none.

devices-collection:
  get:
    operationId: getDevices
    summary: List the caller's devices
    description: |
      Returns every device the authenticated caller owns, sorted by name,
      wrapped under a `devices` key (NOT a bare array, NOT ApiResponse).
      A `userId` query parameter or `x-user-id` header is ignored.
    tags: [devices]
    responses:
      '200':
        description: The caller's devices (possibly none).
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/device.yaml#/DeviceListResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

  post:
    operationId: registerDevice
    summary: Register a device to the caller
    description: |
      Creates the device with the caller as owner, `isActive: true` and
      `connectionStatus: 'unknown'`. A supplied `configuration` is completed
      from DEFAULT_DEVICE_CONFIGURATION. The document is created, never
      upserted, so an existing id is never overwritten.
    tags: [devices]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/device.yaml#/RegisterDeviceRequest'
    responses:
      '201':
        description: The registered device.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/device.yaml#/Device'
      '400':
        $ref: '../components/responses.yaml#/DeviceValidationError'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '409':
        description: |
          DEVICE_CONFLICT: a device with this id already exists (whoever owns
          it), or the caller already has a device with this name. The text is
          fixed and does not say which.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

device-item:
  get:
    operationId: getDevice
    summary: Get one of the caller's devices
    description: |
      Returns the Device with id=`{id}` as a bare object. A device that does
      not exist and one owned by someone else both answer 404, so the
      response does not reveal that another user's device exists.
    tags: [devices]
    parameters:
      - $ref: '../components/parameters.yaml#/DeviceIdPath'
    responses:
      '200':
        description: The device.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/device.yaml#/Device'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/DeviceNotFound'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

  patch:
    operationId: updateDevice
    summary: Change a device's name, location, or configuration
    description: |
      Partial update. `configuration` merges field by field over the stored
      configuration (`alertSettings` one level deeper), so send only the
      fields you want to change. The write is conditioned on the version
      read (If-Match); if the device changed in between, the answer is
      409 CONCURRENT_UPDATE and the client should read it again and retry.
    tags: [devices]
    parameters:
      - $ref: '../components/parameters.yaml#/DeviceIdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/device.yaml#/UpdateDeviceRequest'
    responses:
      '200':
        description: The updated device.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/device.yaml#/Device'
      '400':
        $ref: '../components/responses.yaml#/DeviceValidationError'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/DeviceNotFound'
      '409':
        description: |
          DEVICE_CONFLICT: the caller already has another device with the new
          name. CONCURRENT_UPDATE: the device changed between the read and the
          write.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
