    tags: [cooks]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/cook.yaml#/UpdateCookRequest'
    responses:
      '200':
        description: Updated cook.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '400':
