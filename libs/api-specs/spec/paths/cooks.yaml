# Cook path items.
# Top-level keys are referenced from openapi.yaml's `paths` block.
#
# Implementation status:
#   - cooks-collection : GET / POST implemented (apps/api/src/functions/cooks/{list-cooks,start-cook}.ts)
#   - all others       : NOT YET IMPLEMENTED — descriptions are prefixed accordingly.

cooks-collection:
  get:
    operationId: listCooks
    summary: List cook sessions
    description: |
      Returns one page of the authenticated caller's cook sessions. Mirrors
      apps/api/src/functions/cooks/list-cooks.ts (CookListResponse — bare
      cook array under `cooks` with limit/hasMore/continuationToken, NOT
      wrapped in ApiResponse). Each cook carries only Cook contract fields.

      Filters (MG-87): `deviceId` and `status` narrow the list and combine
      with AND, so `?deviceId=<id>&status=active` returns only the caller's
      active cook on that device. Newest first; paged by continuation token.
      An invalid filter is rejected before any read:
        - 400 VALIDATION_ERROR: `status` is not a CookStatus.
        - 400 VALIDATION_ERROR: `deviceId` is empty or longer than 128
          characters.
    tags: [cooks]
    parameters:
      - name: userId
        in: query
        required: false
        description: |
          Ignored by the deployed API, which lists only the authenticated
          caller's cooks. The mock server uses it as a filter.
        schema:
          type: string
      - name: deviceId
        in: query
        required: false
        description: |
          Only cooks on this device. Opaque; 1 to 128 characters, otherwise
          400 VALIDATION_ERROR. Combines with `status` by AND. The device is
          not checked for ownership: the list is always the caller's own cooks.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: status
        in: query
        required: false
        description: |
          Only cooks in this status; any other value is 400 VALIDATION_ERROR.
          Combines with `deviceId` by AND.
        schema:
          $ref: '../components/schemas/cook.yaml#/CookStatus'
      - name: limit
        in: query
        required: false
        description: Page size. Default 20; the API clamps larger values to 100.
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: continuationToken
        in: query
        required: false
        description: |
          Opaque cursor from the previous page's `continuationToken`. Omit for
          the first page.
        schema:
          type: string
    responses:
      '200':
        description: Paginated list of cooks.
        headers:
          X-Request-ID:
            description: Functions invocation id (correlation handle).
            schema:
              type: string
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/CookListResponse'
      '400':
        description: |
          Invalid filter: `status` is not a CookStatus, or `deviceId` is empty
          or longer than 128 characters. No read is issued, so there is no
          x-meatgeek-request-charge header.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

  post:
    operationId: startCook
    summary: Start a new cook session
    description: |
      Creates a cook in `active` status. Mirrors apps/api/src/functions/cooks/
      start-cook.ts: validates id/name/deviceId/meatType and returns the Cook
      directly (NOT wrapped in ApiResponse).

      Retry-safe (MG-84). The client generates the cook `id` (a UUID) once
      per start intent and resends the same request on every retry:
        - 201: the cook was created; `cook_started` is emitted once.
        - 200: a cook with this id already exists with the same body (a
          retry or a concurrent duplicate). The stored cook is returned and
          nothing is emitted.
        - 422 COOK_ID_REUSED: the id exists with a different body.
        - 409 COOK_ALREADY_ACTIVE: the device already has an active cook for
          this user. One active cook per user and device; since only the
          device's owner can start a cook on it (below), that is in effect one
          active cook per device. Stop it first.
        - 400 VALIDATION_ERROR: a required field is missing or `id` is not a
          UUID.
        - 403 DEVICE_NOT_OWNED (HAR-26, MG-88): `deviceId` is not a device the
          caller registered. Checked with one point read on the devices
          container after validation and before any write: no cook, no device
          lock, no `cook_started`. A device registered to someone else and an
          unregistered device get the same body, so the answer does not reveal
          whether another user owns the id.
    tags: [cooks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/cook.yaml#/StartCookRequest'
    responses:
      '200':
        description: |
          Replay. A cook with this id already exists with the same body; it is
          returned unchanged and no `cook_started` is emitted.
        headers:
          X-Request-ID:
            schema:
              type: string
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '201':
        description: Cook created.
        headers:
          X-Request-ID:
            schema:
              type: string
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '403':
        description: |
          DEVICE_NOT_OWNED. The device is not registered to the caller (it
          belongs to someone else, or nobody registered it; the body is the
          same either way). Nothing was written and nothing was emitted.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '409':
        description: |
          COOK_ALREADY_ACTIVE. The device already has an active cook for this
          user; `activeCookId` names it. Nothing was written.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/CookAlreadyActiveError'
      '422':
        description: |
          COOK_ID_REUSED. A cook with this id exists with a different body.
          Nothing was written.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '400':
        description: Validation failure (missing id/name/deviceId/meatType, or id not a UUID).
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

