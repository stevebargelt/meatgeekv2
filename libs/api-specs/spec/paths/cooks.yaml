# Cook path items. Top-level keys are referenced from openapi.yaml's `paths`.
#
#   - cooks-collection GET  : apps/api/src/functions/cooks/list-cooks.ts
#   - cooks-collection POST : apps/api/src/functions/cooks/start-cook.ts
#   - cook-item GET         : apps/api/src/functions/cooks/get-cook.ts
#   - cook-stop POST        : apps/api/src/functions/cooks/stop-cook.ts
#
# Identity comes only from the Easy Auth principal (X-MS-CLIENT-PRINCIPAL).
# Cooks live in the caller's own partition of the cooks container.

cooks-collection:
  get:
    operationId: listCooks
    summary: List the caller's cooks
    description: |
      Returns one page of the authenticated caller's cooks as a
      CookListResponse: a bare cook array under `cooks` with `limit`,
      `hasMore` and `continuationToken`. Newest first; paged by continuation
      token, never offset. Each cook carries only Cook contract fields.

      Filters (MG-87): `deviceId` and `status` narrow the list and combine
      with AND, so `?deviceId=<id>&status=active` returns only the caller's
      active cook on that device. Neither can widen the query beyond the
      caller's own cooks. An invalid filter is 400 VALIDATION_ERROR before any
      read.

      There is no `userId` parameter: a `userId` in the query is ignored.

      Every response carries X-Request-ID: the caller's `X-Request-ID` when
      sent, else the invocation id (HAR-75).
    tags: [cooks]
    parameters:
      - name: deviceId
        in: query
        required: false
        description: |
          Only cooks on this device. Opaque; 1 to 128 characters, otherwise
          400 VALIDATION_ERROR. The device is not checked for ownership: the
          list is always the caller's own cooks.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: status
        in: query
        required: false
        description: Only cooks in this status; any other value is 400 VALIDATION_ERROR.
        schema:
          $ref: '../components/schemas/cook.yaml#/CookStatus'
      - name: limit
        in: query
        required: false
        description: |
          Page size. Default 20. A value above 100 is clamped to 100; a
          fraction is rounded down. A value that is not a positive number uses
          the default rather than failing. The response's `limit` is the size
          applied.
        schema:
          type: integer
          default: 20
      - name: continuationToken
        in: query
        required: false
        description: |
          Opaque cursor from the previous page's `continuationToken`. Omit for
          the first page. A token Cosmos does not accept fails the read (500).
        schema:
          type: string
    responses:
      '200':
        description: One page of the caller's cooks (possibly empty).
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/CookListResponse'
      '400':
        description: |
          VALIDATION_ERROR: `status` is not a CookStatus, or `deviceId` is
          empty or longer than 128 characters. No read is issued, so there is
          no x-meatgeek-request-charge.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '500':
        $ref: '#/shared/cook-server-error'

  post:
    operationId: startCook
    summary: Start a cook
    description: |
      Creates a cook in `active` status and returns the persisted Cook
      directly (NOT wrapped in ApiResponse).

      Retry-safe (MG-84). The client generates the cook `id` (a UUID) once
      per start intent and resends the same request on every retry:
        - 201: the cook was created; `cook_started` is emitted once.
        - 200: a cook with this id already exists with the same body (a
          retry or a concurrent duplicate). The stored cook is returned and
          nothing is emitted.
        - 422 COOK_ID_REUSED: the id exists with a different body.
        - 409 COOK_ALREADY_ACTIVE: the device already has an active cook for
          this user. One active cook per user and device; since only the
          device's owner can start a cook on it (below), that is in effect one
          active cook per device. Stop it first.
        - 400 VALIDATION_ERROR (HAR-75): the body is not valid JSON, is
          `null` or is not an object; it has a field StartCookRequest does
          not list; or a field breaks its rule (see StartCookRequest). The
          message names the field. No Cosmos call is made.
        - 403 DEVICE_NOT_OWNED (HAR-26, MG-88): `deviceId` is not a device the
          caller registered. Checked with one point read on the devices
          container after validation and before any write: no cook, no device
          lock, no `cook_started`. A device registered to someone else and an
          unregistered device get the same body, so the answer does not reveal
          whether another user owns the id.
        - 503 DEVICE_TWIN_UPDATE_FAILED (HAR-66): see below.
        - 500 INTERNAL_SERVER_ERROR: a Cosmos failure.

      Device twin (HAR-66). After a 201, and after a 200 replay, the API sets
      the device's IoT Hub twin desired properties from Cosmos under its
      managed identity: `activeCookId` is the device's active cook and
      `correlationId` is this request's `X-Request-ID` (else the invocation
      id), or the twin's existing one when it already names that cook. No
      twin call is made on 400, 401, 403, 409, 422 or 500. A device with no
      IoT Hub identity has no twin, and the normal status is returned. If the
      twin update fails the cook stays created and the answer is 503;
      resending the same request replays (200) and retries the twin update.
      `cook_started` is still emitted when this call created the cook.

      Every response carries X-Request-ID: the caller's `X-Request-ID` when
      sent, else the invocation id (HAR-75). The same value is the twin's
      and the `cook_started` message's correlation id. The body's
      `requestId` is the invocation id.
    tags: [cooks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/cook.yaml#/StartCookRequest'
    responses:
      '200':
        description: |
          Replay. A cook with this id already exists with the same body; it is
          returned unchanged and no `cook_started` is emitted.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '201':
        description: Cook created.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '400':
        description: |
          VALIDATION_ERROR: the body is not a JSON object (invalid JSON,
          `null`, an array), has an unknown field, or breaks a field rule;
          `message` names the field. No Cosmos call is made, so there is no
          x-meatgeek-request-charge.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '#/shared/device-not-owned'
      '409':
        description: |
          COOK_ALREADY_ACTIVE. The device already has an active cook for this
          user; `activeCookId` names it. Nothing was written.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/CookAlreadyActiveError'
      '422':
        description: |
          COOK_ID_REUSED. A cook with this id exists with a different body.
          Nothing was written.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '#/shared/cook-server-error'
      '503':
        description: |
          DEVICE_TWIN_UPDATE_FAILED. The cook was created (or already existed
          with the same body) but the device twin was not updated. `cookId`
          names the cook; `reason` is a fixed code. Resend the same request.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/DeviceTwinUpdateFailedError'

cook-item:
  get:
    operationId: getCook
    summary: Get one of the caller's cooks
    description: |
      Returns the caller's cook `{cookId}` as a bare Cook (NOT wrapped in
      ApiResponse), projected onto the Cook contract fields only (HAR-75).

      One point read of (caller, `{cookId}`) in the cooks container, which is
      partitioned on the caller's user id. A cook that does not exist and a
      cook that belongs to another user are the same 404 NOT_FOUND: another
      user's cook is in another partition and is never read. The device lock
      documents that share the partition (ids `active-device:<deviceId>`) are
      not cooks and are 404 too. No device ownership read is made.

      Every response carries X-Request-ID: the caller's `X-Request-ID` when
      sent, else the invocation id. Every response that reached Cosmos, the
      404 included, carries x-meatgeek-request-charge.
    tags: [cooks]
    parameters:
      - name: cookId
        in: path
        required: true
        description: |
          Id of the cook. Opaque (cooks started before MG-84 have
          `cook-<epoch-ms>` ids); 1-128 characters, otherwise 400.
        schema:
          type: string
          minLength: 1
          maxLength: 128
    responses:
      '200':
        description: The cook.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '400':
        description: |
          VALIDATION_ERROR: `{cookId}` is empty or longer than 128
          characters. No Cosmos call is made.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '404':
        description: |
          NOT_FOUND: no cook with this id in the caller's partition. Absent,
          another user's, and a device lock id all answer the same.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

cook-stop:
  post:
    operationId: stopCook
    summary: Stop a cook
    description: |
      Moves the caller's cook `{cookId}` to `completed`, sets `endTime` to
      now, and emits `cook_stopped` to the caller. Mirrors
      apps/api/src/functions/cooks/stop-cook.ts:
        - The request has no body; the handler never reads one. The device is
          the one stored on the cook.
        - The cook is point-read in the caller's partition. Absent there
          (never started, or another user's) is 404 NOT_FOUND.
        - HAR-26 (MG-83): the stored cook's device must be registered to the
          caller. If it belongs to someone else, or is not registered, the
          answer is 403 DEVICE_NOT_OWNED with no write and no
          `cook_stopped`.
        - Otherwise the stop is written and 200 returns the completed Cook
          directly (NOT wrapped in ApiResponse). `cook_stopped` carries the
          persisted cook (MG-31) and is emitted only by the call that made the
          transition; stopping an already-completed cook returns it again with
          200 and emits nothing.
        - HAR-66: after the stop is written, transitioned or not, the device's
          IoT Hub twin desired properties are set from Cosmos under the API's
          managed identity: `activeCookId` and `correlationId` are removed
          when the device has no active cook. No twin call is made on 400,
          401, 403, 404 or 500. A device with no IoT Hub identity has no twin,
          and the normal status is returned. If the twin update fails the cook
          stays completed and the answer is 503 DEVICE_TWIN_UPDATE_FAILED;
          resending the stop retries the twin update.
    tags: [cooks]
    parameters:
      - name: cookId
        in: path
        required: true
        description: |
          Id of the cook to stop. Opaque (cooks started before MG-84 have
          `cook-<epoch-ms>` ids). An id that is only whitespace is 400.
        schema:
          type: string
    responses:
      '200':
        description: Cook now completed (or already was).
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '400':
        description: |
          VALIDATION_ERROR: `{cookId}` is blank. No Cosmos call is made.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '403':
        $ref: '#/shared/device-not-owned'
      '404':
        description: NOT_FOUND. No cook with this id in the caller's partition.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
      '503':
        description: |
          DEVICE_TWIN_UPDATE_FAILED. The cook is completed but the device twin
          was not updated. `cookId` names the cook; `reason` is a fixed code.
          Resend the stop.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/DeviceTwinUpdateFailedError'

# Pieces the operations above share. Not path items: openapi.yaml references
# only cooks-collection, cook-item and cook-stop.
shared:
  device-not-owned:
    description: |
      DEVICE_NOT_OWNED. The device is not registered to the caller (it
      belongs to someone else, or nobody registered it; the body is the same
      either way). Nothing was written and nothing was emitted.
    headers:
      X-Request-ID:
        $ref: '../components/headers.yaml#/X-Request-ID'
      x-meatgeek-request-charge:
        $ref: '../components/headers.yaml#/RequestCharge'
    content:
      application/json:
        schema:
          $ref: '../components/schemas/common.yaml#/ErrorResponse'

  cook-server-error:
    description: |
      INTERNAL_SERVER_ERROR with fixed text: missing configuration or a Cosmos
      failure. Carries x-meatgeek-request-charge when the Cosmos calls made
      before the failure, or the failing call, reported a charge. Carries
      X-Request-ID (the caller's, else the invocation id) since HAR-75; the
      body's `requestId` is the invocation id.
    headers:
      X-Request-ID:
        $ref: '../components/headers.yaml#/X-Request-ID'
      x-meatgeek-request-charge:
        $ref: '../components/headers.yaml#/RequestCharge'
    content:
      application/json:
        schema:
          $ref: '../components/schemas/common.yaml#/ErrorResponse'
