cook-start:
  post:
    operationId: startExistingCook
    summary: Transition a planned cook to active
    description: |
      NOT YET IMPLEMENTED - Moves cook id=`{id}` from `planning` to `active`.
      Idempotent: a cook already in `active` returns 200 with the unchanged
      Cook (no double-start side effects).
    tags: [cooks]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Cook now active.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '404':
        description: Cook not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '409':
        description: Invalid status transition (e.g., `completed` → active).
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

cook-stop:
  post:
    operationId: stopCook
    summary: Stop an active cook
    description: |
      Moves the caller's cook id=`{cookId}` to `completed`, sets endTime to
      now(), and emits a `cook_stopped` SignalR message on the device's user
      group. Mirrors apps/api/src/functions/cooks/stop-cook.ts:
        - The request has no body; the handler never reads one. The device is
          the one stored on the cook.
        - The cook is point-read in the caller's partition. Absent there
          (never started, or another user's) is 404 NOT_FOUND.
        - HAR-26 (MG-83): the stored cook's device must be registered to the
          caller. If it belongs to someone else, or is not registered, the
          answer is 403 DEVICE_NOT_OWNED with no write and no
          `cook_stopped`.
        - Otherwise the stop is written and 200 returns the completed Cook
          directly (NOT wrapped in ApiResponse). `cook_stopped` carries the
          persisted cook (MG-31) and is emitted only by the call that made the
          transition; stopping an already-completed cook returns it again with
          200 and emits nothing.
    tags: [cooks]
    parameters:
      - name: cookId
        in: path
        required: true
        description: Id of the cook to stop (route is cooks/{cookId}/stop).
        schema:
          type: string
    responses:
      '200':
        description: Cook now completed (or already was).
        headers:
          X-Request-ID:
            description: Correlation id (propagated X-Request-ID or invocation id).
            schema:
              type: string
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '403':
        description: |
          DEVICE_NOT_OWNED. The cook's device is not registered to the caller
          (it belongs to someone else, or nobody registered it; the body is the
          same either way). Nothing was written and nothing was emitted.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '404':
        description: NOT_FOUND. No cook with this id in the caller's partition.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        headers:
          x-meatgeek-request-charge:
            description: |
              Cosmos request charge (RU) of the call, as a decimal (HAR-11).
              Present whenever the call reached Cosmos; absent when it did not
              (e.g. a 400 before any read).
            schema:
              type: string
              example: '7.42'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

