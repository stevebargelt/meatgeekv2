# Cook path items.
# Top-level keys are referenced from openapi.yaml's `paths` block.
#
# Implementation status:
#   - cooks-collection : GET / POST implemented (apps/api/src/functions/cooks/{list-cooks,start-cook}.ts)
#   - all others       : NOT YET IMPLEMENTED — descriptions are prefixed accordingly.

cooks-collection:
  get:
    operationId: listCooks
    summary: List cook sessions
    description: |
      Returns one page of the authenticated caller's cook sessions. Mirrors
      apps/api/src/functions/cooks/list-cooks.ts (CookListResponse — bare
      cook array under `cooks` with limit/hasMore/continuationToken, NOT
      wrapped in ApiResponse). Each cook carries only Cook contract fields.
    tags: [cooks]
    parameters:
      - name: userId
        in: query
        required: false
        description: |
          Ignored by the deployed API, which lists only the authenticated
          caller's cooks. The mock server uses it as a filter.
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '../components/schemas/cook.yaml#/CookStatus'
      - name: limit
        in: query
        required: false
        description: Page size. Default 20; the API clamps larger values to 100.
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: continuationToken
        in: query
        required: false
        description: |
          Opaque cursor from the previous page's `continuationToken`. Omit for
          the first page.
        schema:
          type: string
    responses:
      '200':
        description: Paginated list of cooks.
        headers:
          X-Request-ID:
            description: Functions invocation id (correlation handle).
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/CookListResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

  post:
    operationId: startCook
    summary: Start a new cook session
    description: |
      Creates a cook in `active` status. Mirrors apps/api/src/functions/cooks/
      start-cook.ts: validates id/name/deviceId/meatType and returns the Cook
      directly (NOT wrapped in ApiResponse).

      Retry-safe (MG-84). The client generates the cook `id` (a UUID) once
      per start intent and resends the same request on every retry:
        - 201: the cook was created; `cook_started` is emitted once.
        - 200: a cook with this id already exists with the same body (a
          retry or a concurrent duplicate). The stored cook is returned and
          nothing is emitted.
        - 422 COOK_ID_REUSED: the id exists with a different body.
        - 409 COOK_ALREADY_ACTIVE: the device already has an active cook for
          this user. One active cook per device; stop it first.
        - 400 VALIDATION_ERROR: a required field is missing or `id` is not a
          UUID.
    tags: [cooks]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/cook.yaml#/StartCookRequest'
    responses:
      '200':
        description: |
          Replay. A cook with this id already exists with the same body; it is
          returned unchanged and no `cook_started` is emitted.
        headers:
          X-Request-ID:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '201':
        description: Cook created.
        headers:
          X-Request-ID:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '409':
        description: |
          COOK_ALREADY_ACTIVE. The device already has an active cook for this
          user; `activeCookId` names it. Nothing was written.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/CookAlreadyActiveError'
      '422':
        description: |
          COOK_ID_REUSED. A cook with this id exists with a different body.
          Nothing was written.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '400':
        description: Validation failure (missing id/name/deviceId/meatType, or id not a UUID).
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

cook-item:
  get:
    operationId: getCook
    summary: Get a single cook by id
    description: |
      NOT YET IMPLEMENTED - Will return the Cook with id=`{id}`. Returns 404
      with NOT_FOUND if no cook exists.
    tags: [cooks]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Cook found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '404':
        description: Cook not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

  patch:
    operationId: updateCook
    summary: Patch a cook session
    description: |
      NOT YET IMPLEMENTED - Partial update of name/status/targetTemps/notes/
      rating/endTime. Status transitions are validated server-side (e.g.,
      cannot move `completed` → `active`).
    tags: [cooks]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/cook.yaml#/UpdateCookRequest'
    responses:
      '200':
        description: Updated cook.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '400':
        description: Invalid status transition or schema violation.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '404':
        description: Cook not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

cook-start:
  post:
    operationId: startExistingCook
    summary: Transition a planned cook to active
    description: |
      NOT YET IMPLEMENTED - Moves cook id=`{id}` from `planning` to `active`.
      Idempotent: a cook already in `active` returns 200 with the unchanged
      Cook (no double-start side effects).
    tags: [cooks]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Cook now active.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '404':
        description: Cook not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '409':
        description: Invalid status transition (e.g., `completed` → active).
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

cook-stop:
  post:
    operationId: stopCook
    summary: Stop an active cook
    description: |
      Moves cook id=`{cookId}` to `completed`, sets endTime to now(), and emits
      a `cook_stopped` SignalR message on the device's user group. Mirrors the
      SHIPPED handler apps/api/src/functions/cooks/stop-cook.ts: validates
      `deviceId` presence (400 VALIDATION_ERROR if missing) and returns 200 with
      the completed Cook directly (NOT wrapped in ApiResponse). The emitted
      cook is a synthetic placeholder — the cook is not yet persisted (DEC-3).
      No 404 is documented: the handler synthesizes the Cook from the path
      `cookId` and performs no lookup, so a not-found response is unreachable
      today. A 404 not-found will be introduced once cook persistence/lookup
      lands (tracked as MG-31).
    tags: [cooks]
    parameters:
      - name: cookId
        in: path
        required: true
        description: Id of the cook to stop (route is cooks/{cookId}/stop).
        schema:
          type: string
    requestBody:
      required: true
      description: |
        Handler requires `deviceId` (scopes the emitted cook_stopped SignalR
        message to the device's user group); missing deviceId is a 400.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - deviceId
            properties:
              deviceId:
                type: string
    responses:
      '200':
        description: Cook now completed.
        headers:
          X-Request-ID:
            description: Correlation id (propagated X-Request-ID or invocation id).
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/Cook'
      '400':
        description: Validation failure (missing deviceId).
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'

cook-history:
  get:
    operationId: getCookHistory
    summary: Get aggregate summary for a completed cook
    description: |
      NOT YET IMPLEMENTED - Returns CookSummary statistics for cook
      id=`{id}`. Only valid for cooks in `completed` status; returns 409
      CONFLICT for in-progress cooks.
    tags: [cooks]
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Cook summary.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/cook.yaml#/CookSummary'
      '404':
        description: Cook not found.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '409':
        description: Cook is not yet completed.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        description: Server error.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
