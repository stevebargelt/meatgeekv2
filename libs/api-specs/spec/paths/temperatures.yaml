# Temperature path items.
#
#   - temperatures-current GET : apps/api/src/functions/temperatures/get-current.ts
#                                (HAR-28 / MG-79 part 1)
#   - temperatures-history GET : apps/api/src/functions/temperatures/get-history.ts
#                                (HAR-35 / MG-79 part 2)
#
# History endpoint documents STRICT cookId tag-match semantics: a `?cookId=X`
# filter returns only readings whose `cookId` field equals X — it does NOT
# expand to "all readings inside the cook's time window". This decision is
# load-bearing for CosmosDB partitioning (ticket #1) and must not silently
# change.

temperatures-current:
  get:
    operationId: getCurrentTemperatures
    summary: Get the latest temperature reading for a device the caller owns
    description: |
      Returns the most recent TemperatureReading for a device the
      authenticated caller owns, as a BARE TemperatureReading (NOT wrapped in
      ApiResponse).

      Identity comes only from the Easy Auth principal (X-MS-CLIENT-PRINCIPAL).
      The device must be registered to the caller (POST /devices); a device
      that does not exist and one owned by someone else both answer
      404 DEVICE_NOT_FOUND with the same body.

      Readings are the documents IoT Hub routes into the `temperatures`
      container (partitioned on /deviceId). The newest is chosen by the hub's
      `iothub-enqueuedtime`, with one single-partition query.

      Trust rule (MG-73): the reading's `deviceId` is the hub-authenticated
      `SystemProperties["iothub-connection-device-id"]`, never the
      device-supplied `Body.deviceId`. A stored document whose hub identity is
      not this device, or whose body is not a JSON object, is skipped.
      `timestamp` is the device's `Body.timestamp` when it parses as a date,
      else the hub's enqueued time. A temperature that is not a finite number
      is omitted.

      Every response that reached Cosmos, the 404s included, carries
      x-meatgeek-request-charge: the device ownership read plus the readings
      query. A 401 or 400 is answered before any Cosmos call and carries none.
    tags: [temperatures]
    parameters:
      - name: deviceId
        in: path
        required: true
        description: |
          The device id: 1-128 characters of A-Z, a-z, 0-9, ".", "_", ":" or
          "-" (the POST /devices rule). Anything else is 400.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
    responses:
      '200':
        description: Latest reading for the device.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/temperature.yaml#/TemperatureReading'
      '400':
        description: |
          VALIDATION_ERROR: the deviceId is not a valid device id. Answered
          before any Cosmos call.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '404':
        description: |
          DEVICE_NOT_FOUND: no such device, or it belongs to someone else (the
          two are indistinguishable on purpose).
          NO_READINGS: the caller owns the device, but no reading for it has
          been stored.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

temperatures-history:
  get:
    operationId: getTemperatureHistory
    summary: A page of the stored readings for a device the caller owns
    description: |
      Returns one page of TemperatureReading rows for a device the
      authenticated caller owns, as a TemperatureHistoryResponse
      `{ readings, total, offset, limit, hasMore }`.

      Identity comes only from the Easy Auth principal (X-MS-CLIENT-PRINCIPAL).
      The device must be registered to the caller (POST /devices); a device
      that does not exist and one owned by someone else both answer
      404 DEVICE_NOT_FOUND with the same body. An owned device with no
      readings answers 200 with `readings: []` and `total: 0`.

      Readings are the documents IoT Hub routes into the `temperatures`
      container (partitioned on /deviceId), read with single-partition
      queries only.

      Window and order: `startTime` (inclusive) and `endTime` (exclusive)
      bound the hub's `iothub-enqueuedtime`, the time IoT Hub RECEIVED the
      message, never the device-supplied `Body.timestamp`. Readings are in
      ascending enqueued-time order (oldest first). Each reading's
      `timestamp` is still the device's `Body.timestamp` when it parses as a
      date, else the enqueued time, so a reading near a bound can carry a
      `timestamp` just outside the window.

      Trust rule (MG-73): a reading's `deviceId` is the hub-authenticated
      `SystemProperties["iothub-connection-device-id"]`, never
      `Body.deviceId`. A stored document whose hub identity is not this
      device, or whose body is not a JSON object, is neither counted nor
      returned. A temperature that is not a finite number is omitted.

      Paging: `total` counts every matching document; `hasMore` is
      `offset + limit < total`. A matching document that still cannot be
      mapped (no usable timestamp) is counted but not returned, so a page can
      hold fewer than `limit` readings while `hasMore` is true.

      Every response that reached Cosmos, the 404 included, carries
      x-meatgeek-request-charge: the device ownership read plus, for a 200,
      the count and page queries. A 401 or 400 is answered before any Cosmos
      call and carries none.
    tags: [temperatures]
    parameters:
      - name: deviceId
        in: query
        required: true
        description: |
          Device whose readings to return: 1-128 characters of A-Z, a-z, 0-9,
          ".", "_", ":" or "-" (the POST /devices rule). Missing or anything
          else is 400.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
      - name: cookId
        in: query
        required: false
        description: |
          STRICT TAG-MATCH semantics: when present, only readings whose
          `cookId` field equals this value are returned. This is NOT a
          time-window shorthand — readings that fall inside the cook's
          start/end interval but lack the cookId tag (e.g., reading
          recorded before the cook session was created) are EXCLUDED.

          The strict semantic is load-bearing for ticket #1 (CosmosDB
          partitioning); do not silently relax it without coordination
          with the API team.

          1-128 characters. Not checked against the cooks container.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: startTime
        in: query
        required: false
        description: |
          ISO-8601 lower bound (inclusive) on the hub's enqueued time. Must be
          before `endTime` when both are given. The handler accepts any value
          JavaScript's `Date` parses and normalises it to UTC; anything else
          is 400.
        schema:
          type: string
          format: date-time
      - name: endTime
        in: query
        required: false
        description: |
          ISO-8601 upper bound (exclusive) on the hub's enqueued time. Parsed
          like `startTime`.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: Page size. Default 100. A non-integer or a value outside 1-5000 is 400.
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - name: offset
        in: query
        required: false
        description: Readings to skip. Default 0. A non-integer or a negative value is 400.
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      '200':
        description: |
          A page of readings, oldest enqueued time first. Empty (`total: 0`)
          for an owned device with no matching readings.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/temperature.yaml#/TemperatureHistoryResponse'
      '400':
        description: |
          VALIDATION_ERROR: a missing or invalid deviceId, an empty or
          over-long cookId, a startTime or endTime that is not a date, a
          startTime not before endTime, or a limit or offset that is not an
          integer in range. Answered before any Cosmos call.
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
      '404':
        description: |
          DEVICE_NOT_FOUND: no such device, or it belongs to someone else (the
          two are indistinguishable on purpose).
        headers:
          X-Request-ID:
            $ref: '../components/headers.yaml#/X-Request-ID'
          x-meatgeek-request-charge:
            $ref: '../components/headers.yaml#/RequestCharge'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
