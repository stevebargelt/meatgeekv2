openapi: 3.0.3

info:
  title: MeatGeek V2 API
  version: 0.2.0
  description: |
    The contract between the MeatGeek V2 API and its clients. It describes
    exactly the HTTP routes `apps/api/src/main.ts` registers and the SignalR
    messages the API sends, and nothing else.

    ## Drift check

    `npx nx test api` runs `apps/api/src/contract/contract.spec.ts` on every
    pull request. It fails when a route registered in `main.ts` is missing
    here or an operation here has no route, when an operation lacks the
    bearer security or a `401`, when this document does not validate, or when
    a SignalR message the API builds does not match its `x-signalr` schema.

    ## Authentication

    Every route sits behind App Service Authentication (Easy Auth). Send an
    Entra ID access token for the API's audience as `Authorization: Bearer`.
    Easy Auth validates it before any function runs and answers `401` itself
    when it is missing or invalid; a handler that runs without a usable
    principal answers `401 UNAUTHENTICATED`. The caller's identity is always
    the token's tenant id and object id, `"<tid>:<oid>"`; no route takes a
    user id.

    ## Errors

    Error bodies are flat: `{error, message, requestId}`, where `error` is an
    `ErrorCode`, plus the extra fields a variant names (`activeCookId`,
    `cookId`, `reason`). The `401` body carries `reason` in place of
    `message`.

    ## SignalR

    The top-level `x-signalr` extension names the hub, the route that
    negotiates a connection to it, and the messages it carries. Each key under
    `messages` is a SignalR target (`connection.on('<key>', ...)`) and points
    to the schema of that target's single argument.
  contact:
    name: MeatGeek V2 team
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:7071/api
    description: Local Azure Functions Core Tools. Every route is under /api.

security:
  - bearerAuth: []

tags:
  - name: cooks
    description: Start, stop, read and list the caller's cooks.
  - name: temperatures
    description: The latest and historical readings of the caller's devices.
  - name: devices
    description: Claim, register and manage the caller's devices.
  - name: users
    description: The authenticated caller's own profile, and the phones its alerts go to.
  - name: recipes
    description: The authenticated caller's private recipes.
  - name: signalr
    description: Negotiate a SignalR connection for live readings and cook events.
  - name: health
    description: Health of the API's own dependencies.

paths:
  /cooks:
    $ref: './paths/cooks.yaml#/cooks-collection'
  /cooks/{cookId}:
    $ref: './paths/cooks.yaml#/cook-item'
  /cooks/{cookId}/chart:
    $ref: './paths/cooks.yaml#/cook-chart'
  /cooks/{cookId}/stop:
    $ref: './paths/cooks.yaml#/cook-stop'
  /negotiate:
    $ref: './paths/negotiate.yaml#/negotiate'
  /temperatures/current/{deviceId}:
    $ref: './paths/temperatures.yaml#/temperatures-current'
  /temperatures/history:
    $ref: './paths/temperatures.yaml#/temperatures-history'
  /devices:
    $ref: './paths/devices.yaml#/devices-collection'
  /devices/claim:
    $ref: './paths/devices.yaml#/device-claim'
  /devices/{id}:
    $ref: './paths/devices.yaml#/device-item'
  /users/me:
    $ref: './paths/users.yaml#/user-me'
  /users/me/push-tokens:
    $ref: './paths/users.yaml#/user-push-tokens'
  /users/me/push-tokens/{tokenId}:
    $ref: './paths/users.yaml#/user-push-token-item'
  /recipes:
    $ref: './paths/recipes.yaml#/recipes-collection'
  /recipes/{id}:
    $ref: './paths/recipes.yaml#/recipe-item'
  /health/cosmos:
    $ref: './paths/health.yaml#/health-cosmos'
  /health/apns:
    $ref: './paths/health.yaml#/health-apns'

x-signalr:
  hub: temperatureHub
  negotiate: /negotiate
  messages:
    temperature:
      $ref: '#/components/schemas/TemperatureMessage'
    cook_started:
      $ref: '#/components/schemas/CookStartedMessage'
    cook_stopped:
      $ref: '#/components/schemas/CookStoppedMessage'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An Entra ID access token whose audience is the API. App Service
        Authentication (Easy Auth) validates it before any function runs and
        passes the validated principal to the handler as
        `X-MS-CLIENT-PRINCIPAL`.

  headers:
    X-Request-ID:
      $ref: './components/headers.yaml#/X-Request-ID'
    RequestCharge:
      $ref: './components/headers.yaml#/RequestCharge'

  parameters:
    DeviceIdPath:
      $ref: './components/parameters.yaml#/DeviceIdPath'
    RecipeIdPath:
      $ref: './components/parameters.yaml#/RecipeIdPath'

  responses:
    Unauthenticated:
      $ref: './components/responses.yaml#/Unauthenticated'
    PlatformUnauthenticated:
      $ref: './components/responses.yaml#/PlatformUnauthenticated'
    ServerError:
      $ref: './components/responses.yaml#/ServerError'
    DeviceValidationError:
      $ref: './components/responses.yaml#/DeviceValidationError'
    DeviceNotFound:
      $ref: './components/responses.yaml#/DeviceNotFound'
    RecipeValidationError:
      $ref: './components/responses.yaml#/RecipeValidationError'
    RecipeNotFound:
      $ref: './components/responses.yaml#/RecipeNotFound'

  schemas:
    # Common
    ErrorCode:
      $ref: './components/schemas/common.yaml#/ErrorCode'
    ErrorResponse:
      $ref: './components/schemas/common.yaml#/ErrorResponse'
    UnauthenticatedError:
      $ref: './components/schemas/common.yaml#/UnauthenticatedError'
    CookAlreadyActiveError:
      $ref: './components/schemas/common.yaml#/CookAlreadyActiveError'
    SignalRUnavailableError:
      $ref: './components/schemas/common.yaml#/SignalRUnavailableError'
    DeviceTwinUpdateFailedError:
      $ref: './components/schemas/common.yaml#/DeviceTwinUpdateFailedError'
    DeviceClaimTwinFailedError:
      $ref: './components/schemas/common.yaml#/DeviceClaimTwinFailedError'
    CosmosHealthResponse:
      $ref: './components/schemas/common.yaml#/CosmosHealthResponse'
    TemperatureUnit:
      $ref: './components/schemas/common.yaml#/TemperatureUnit'
    DeviceConnectionState:
      $ref: './components/schemas/common.yaml#/DeviceConnectionState'
    ISODateTime:
      $ref: './components/schemas/common.yaml#/ISODateTime'

    # Cook
    CookStatus:
      $ref: './components/schemas/cook.yaml#/CookStatus'
    TargetTemperatures:
      $ref: './components/schemas/cook.yaml#/TargetTemperatures'
    TargetReached:
      $ref: './components/schemas/cook.yaml#/TargetReached'
    TargetsReached:
      $ref: './components/schemas/cook.yaml#/TargetsReached'
    Cook:
      $ref: './components/schemas/cook.yaml#/Cook'
    StartCookTargetTemperatures:
      $ref: './components/schemas/cook.yaml#/StartCookTargetTemperatures'
    StartCookRequest:
      $ref: './components/schemas/cook.yaml#/StartCookRequest'
    CookListResponse:
      $ref: './components/schemas/cook.yaml#/CookListResponse'
    CookChartChannel:
      $ref: './components/schemas/cook.yaml#/CookChartChannel'
    CookChartPoint:
      $ref: './components/schemas/cook.yaml#/CookChartPoint'
    CookChart:
      $ref: './components/schemas/cook.yaml#/CookChart'

    # Temperature
    TemperatureReading:
      $ref: './components/schemas/temperature.yaml#/TemperatureReading'
    TemperatureHistoryResponse:
      $ref: './components/schemas/temperature.yaml#/TemperatureHistoryResponse'

    # Device
    Device:
      $ref: './components/schemas/device.yaml#/Device'
    DeviceConfiguration:
      $ref: './components/schemas/device.yaml#/DeviceConfiguration'
    DeviceConnection:
      $ref: './components/schemas/device.yaml#/DeviceConnection'
    DeviceListResponse:
      $ref: './components/schemas/device.yaml#/DeviceListResponse'
    DeviceConfigurationPatch:
      $ref: './components/schemas/device.yaml#/DeviceConfigurationPatch'
    ClaimDeviceRequest:
      $ref: './components/schemas/device.yaml#/ClaimDeviceRequest'
    UpdateDeviceRequest:
      $ref: './components/schemas/device.yaml#/UpdateDeviceRequest'

    # User
    User:
      $ref: './components/schemas/user.yaml#/User'
    UserPreferences:
      $ref: './components/schemas/user.yaml#/UserPreferences'
    NotificationPreferences:
      $ref: './components/schemas/user.yaml#/NotificationPreferences'
    PutUserProfileRequest:
      $ref: './components/schemas/user.yaml#/PutUserProfileRequest'
    RegisterPushTokenRequest:
      $ref: './components/schemas/user.yaml#/RegisterPushTokenRequest'
    PushToken:
      $ref: './components/schemas/user.yaml#/PushToken'
    PushTokenListResponse:
      $ref: './components/schemas/user.yaml#/PushTokenListResponse'

    # Recipe
    RecipeMeatType:
      $ref: './components/schemas/recipe.yaml#/RecipeMeatType'
    RecipeCookMethod:
      $ref: './components/schemas/recipe.yaml#/RecipeCookMethod'
    Recipe:
      $ref: './components/schemas/recipe.yaml#/Recipe'
    RecipeListResponse:
      $ref: './components/schemas/recipe.yaml#/RecipeListResponse'
    CreateRecipeRequest:
      $ref: './components/schemas/recipe.yaml#/CreateRecipeRequest'
    UpdateRecipeRequest:
      $ref: './components/schemas/recipe.yaml#/UpdateRecipeRequest'

    # SignalR: the negotiate response, and the messages listed in x-signalr.
    SignalRConnectionInfo:
      $ref: './components/schemas/signalr-payloads.yaml#/SignalRConnectionInfo'
    CorrelationContext:
      $ref: './components/schemas/signalr-payloads.yaml#/CorrelationContext'
    TemperatureMessage:
      $ref: './components/schemas/signalr-payloads.yaml#/TemperatureMessage'
    CookStartedMessage:
      $ref: './components/schemas/signalr-payloads.yaml#/CookStartedMessage'
    CookStoppedMessage:
      $ref: './components/schemas/signalr-payloads.yaml#/CookStoppedMessage'
