# SignalR schemas.
#
# The hub, its negotiate route and the messages it carries are listed in the
# top-level `x-signalr` extension of openapi.yaml. Each message below is the
# single argument of a SignalR invocation whose target is the `x-signalr`
# message key: a client subscribes with `connection.on('<key>', handler)`.
# These are NOT HTTP endpoints.
#
# The schemas describe exactly what the producers build:
#   - temperature  : toGroupMessage in apps/api/src/functions/signalr/broadcast-temperature.ts
#   - cook_started : buildCookEnvelope in apps/api/src/functions/signalr/envelope.ts
#   - cook_stopped : buildCookEnvelope in apps/api/src/functions/signalr/envelope.ts
# apps/api/src/contract/contract.spec.ts builds one of each with that code and
# validates it against these schemas.
#
# SignalRConnectionInfo is the HTTP response body of POST /negotiate, kept here
# so the negotiate handshake type sits with the messages.

SignalRConnectionInfo:
  type: object
  description: |
    SignalR connection info returned by POST /negotiate
    (apps/api/src/functions/signalr/negotiate.ts). `url` is
    `{serviceUri}/client/?hub=temperatureHub`; `accessToken` is minted for the
    caller's `userId`. The client uses both to open its connection.
  required:
    - url
    - accessToken
  additionalProperties: false
  properties:
    url:
      type: string
      format: uri
      description: Absolute endpoint the client connects to.
    accessToken:
      type: string
      description: |
        Client access token, valid for 60 minutes. Negotiate again for a new
        one; negotiating also refreshes the caller's device groups.

CorrelationContext:
  type: object
  description: |
    Trace correlation block. `id` is the X-Request-ID of the HTTP request that
    caused the event when the caller sent one, else that request's Functions
    invocation id.
  required:
    - id
  additionalProperties: false
  properties:
    id:
      type: string

TemperatureMessage:
  type: object
  description: |
    SignalR target `temperature`. A live reading, sent to group
    `device-{deviceId}`; negotiate puts each user in the groups of the devices
    they own, so it reaches the device's owner. The fields are exactly a
    TemperatureReading (what GET /temperatures/current would return for the
    same IoT Hub message) plus `enqueuedTimeUtc`. Events that cannot be mapped
    to a reading are dropped, not sent.
  required:
    - deviceId
    - timestamp
    - enqueuedTimeUtc
  additionalProperties: false
  properties:
    deviceId:
      $ref: './temperature.yaml#/TemperatureReading/properties/deviceId'
    timestamp:
      $ref: './temperature.yaml#/TemperatureReading/properties/timestamp'
    cookId:
      $ref: './temperature.yaml#/TemperatureReading/properties/cookId'
    grillTemp:
      $ref: './temperature.yaml#/TemperatureReading/properties/grillTemp'
    probe1Temp:
      $ref: './temperature.yaml#/TemperatureReading/properties/probe1Temp'
    probe2Temp:
      $ref: './temperature.yaml#/TemperatureReading/properties/probe2Temp'
    probe3Temp:
      $ref: './temperature.yaml#/TemperatureReading/properties/probe3Temp'
    probe4Temp:
      $ref: './temperature.yaml#/TemperatureReading/properties/probe4Temp'
    enqueuedTimeUtc:
      type: string
      format: date-time
      description: |
        When Event Hubs enqueued the message, as UTC ISO-8601, so a client can
        measure delivery delay.

CookStartedMessage:
  type: object
  description: |
    SignalR target `cook_started`. Sent to the cook's owner (SignalR user id
    `"<tid>:<oid>"`) once, by the POST /cooks call that created the cook (201,
    or a 503 after the cook was created). A replay (200) sends nothing.
    `payload` is the persisted cook, in status `active`.
  required:
    - type
    - timestamp
    - messageId
    - deviceId
    - userId
    - cookId
    - correlation
    - payload
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - cook_started
    timestamp:
      type: string
      format: date-time
      description: When the message was built.
    messageId:
      type: string
      format: uuid
      description: Random UUID per message, for client-side de-duplication.
    deviceId:
      type: string
      description: The cook's device.
    userId:
      type: string
      description: The cook's owner.
    cookId:
      type: string
      description: The device's active cook, which is `payload.id`.
    correlation:
      $ref: '#/CorrelationContext'
    payload:
      $ref: './cook.yaml#/Cook'

CookStoppedMessage:
  type: object
  description: |
    SignalR target `cook_stopped`. Sent to the cook's owner once, by the
    POST /cooks/{cookId}/stop call that moved the cook to `completed`. Stopping
    an already-completed cook sends nothing. There is no envelope `cookId`:
    the device has no active cook after a stop, and the stopped cook is
    `payload.id`. `payload` is the persisted cook, in status `completed`.
  required:
    - type
    - timestamp
    - messageId
    - deviceId
    - userId
    - correlation
    - payload
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - cook_stopped
    timestamp:
      type: string
      format: date-time
      description: When the message was built.
    messageId:
      type: string
      format: uuid
      description: Random UUID per message, for client-side de-duplication.
    deviceId:
      type: string
      description: The cook's device.
    userId:
      type: string
      description: The cook's owner.
    correlation:
      $ref: '#/CorrelationContext'
    payload:
      $ref: './cook.yaml#/Cook'
