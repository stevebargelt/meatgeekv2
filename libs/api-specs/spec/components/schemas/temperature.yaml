# Temperature reading schemas. Mirrors libs/api-interfaces/src/lib/temperature.ts
# and toTemperatureReading in apps/api/src/shared/cosmos/temperatures-repository.ts,
# the one mapper GET /temperatures/current, GET /temperatures/history and the
# `temperature` SignalR message all use.

TemperatureReading:
  type: object
  description: |
    One sensor sample from one device, as toTemperatureReading maps a stored
    IoT Hub document. `deviceId` is the hub-authenticated device identity
    (MG-73). A temperature the device did not send, or sent as something other
    than a finite number, is omitted, never null. GET /temperatures/current
    returns this shape directly as the 200 body.
  required:
    - deviceId
    - timestamp
  additionalProperties: false
  properties:
    deviceId:
      type: string
    timestamp:
      type: string
      description: |
        The device's `Body.timestamp` exactly as sent when it parses as a date
        (devices send ISO-8601), else the hub's enqueued time.
      example: '2026-11-20T18:04:05.123Z'
    cookId:
      type: string
      minLength: 1
      description: |
        Cook session this reading belongs to, when the device tagged it.
        Strict tag-match semantics: see the GET /temperatures/history `cookId`
        query parameter.
    grillTemp:
      type: number
      format: double
      description: Grill chamber reading in degrees F, as the device sent it.
    probe1Temp:
      type: number
      format: double
    probe2Temp:
      type: number
      format: double
    probe3Temp:
      type: number
      format: double
    probe4Temp:
      type: number
      format: double

TemperatureHistoryResponse:
  type: object
  description: |
    Response for GET /temperatures/history (HAR-35). See
    paths/temperatures.yaml for the strict cookId tag-match contract and the
    enqueued-time window and ordering.
  required:
    - readings
    - total
    - offset
    - limit
    - hasMore
  additionalProperties: false
  properties:
    readings:
      type: array
      items:
        $ref: '#/TemperatureReading'
    total:
      type: integer
      minimum: 0
      description: Every matching document, including any that could not be mapped.
    offset:
      type: integer
      minimum: 0
      description: The `offset` applied (the query value, default 0).
    limit:
      type: integer
      minimum: 1
      maximum: 5000
      description: The `limit` applied (the query value, default 100).
    hasMore:
      type: boolean
      description: '`offset + limit < total`.'
