# Cook session schemas. Mirrors libs/api-interfaces/src/lib/cook.ts and the
# handlers in apps/api/src/functions/cooks/.

CookStatus:
  type: string
  description: |
    Cook session lifecycle state. Named enum — generators (oapi-codegen, etc.)
    must produce a typed constant set, not map[string]interface{}.
  enum:
    - planning
    - active
    - paused
    - completed
    - cancelled

TargetTemperatures:
  type: object
  description: |
    Per-probe setpoint group. All members optional — a cook may target the
    grill only, or any subset of probes.
  additionalProperties: false
  properties:
    grill:
      type: number
      format: double
      minimum: -50
      maximum: 1000
      description: Grill chamber setpoint, degrees F.
    probe1:
      type: number
      format: double
      minimum: -50
      maximum: 1000
    probe2:
      type: number
      format: double
      minimum: -50
      maximum: 1000
    probe3:
      type: number
      format: double
      minimum: -50
      maximum: 1000
    probe4:
      type: number
      format: double
      minimum: -50
      maximum: 1000

StartCookTargetTemperatures:
  type: object
  description: |
    The `targetTemps` POST /cooks accepts (HAR-75): any subset of the grill
    and the four probes, each a finite number from 0 to 1000 degrees F. Any
    other key, or a value out of range, is 400 VALIDATION_ERROR naming it.
  additionalProperties: false
  properties:
    grill:
      type: number
      format: double
      minimum: 0
      maximum: 1000
      description: Grill chamber setpoint, degrees F.
    probe1:
      type: number
      format: double
      minimum: 0
      maximum: 1000
    probe2:
      type: number
      format: double
      minimum: 0
      maximum: 1000
    probe3:
      type: number
      format: double
      minimum: 0
      maximum: 1000
    probe4:
      type: number
      format: double
      minimum: 0
      maximum: 1000

Cook:
  type: object
  description: |
    Cook session, as GET /cooks (array items), GET /cooks/{cookId}, POST /cooks and
    POST /cooks/{cookId}/stop return it and as the cook_started and
    cook_stopped SignalR messages carry it. The repository projects every
    stored cook onto exactly these fields (toCook in
    apps/api/src/shared/cosmos/cooks-repository.ts). Cooks started through
    POST /cooks always carry `meatType`; older cooks may not.
  required:
    - id
    - userId
    - deviceId
    - name
    - status
    - startTime
  additionalProperties: false
  properties:
    id:
      type: string
      description: |
        Cook session id. Since MG-84 this is the UUID the client sent as
        `StartCookRequest.id`. Cooks created earlier keep their
        `cook-<epoch-ms>` ids; treat the id as an opaque string.
    userId:
      type: string
    deviceId:
      type: string
    name:
      type: string
      description: Trimmed on start; never blank for a cook started through POST /cooks.
    status:
      $ref: '#/CookStatus'
    startTime:
      type: string
      format: date-time
    endTime:
      type: string
      format: date-time
    meatType:
      type: string
      description: |
        Type of meat (brisket, pork, chicken, ...), free text. Required on
        POST /cooks; absent on cooks stored before it was.
    weight:
      type: number
      format: double
      minimum: 0
      description: Pre-cook weight in pounds.
    targetTemps:
      $ref: '#/TargetTemperatures'
    actualDuration:
      type: number
      format: double
      description: Total cook duration in hours.
    maxTemps:
      $ref: '#/TargetTemperatures'
    notes:
      type: string
    photos:
      type: array
      items:
        type: string
        format: uri
    rating:
      type: integer
      minimum: 1
      maximum: 5
    isPublic:
      type: boolean

StartCookRequest:
  type: object
  description: |
    Body for POST /cooks. Every field has a rule (HAR-75,
    apps/api/src/functions/cooks/cook-requests.ts); a body that is not a JSON
    object (invalid JSON, `null`, an array), has a field not listed here, or
    breaks a field rule is 400 VALIDATION_ERROR with a message naming the
    field. `name` and `meatType` are stored trimmed; `weight`, `targetTemps`
    and `notes` are stored as sent when present.
  required:
    - id
    - name
    - deviceId
    - meatType
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
      description: |
        Client-generated cook id and the idempotency key for the start.
        Generate it once per start intent (e.g. `crypto.randomUUID()`) and
        send the same id, with the same body, on every retry. A repeat
        returns the original cook with 200 and emits no second
        `cook_started`; the same id with a different body returns 422
        COOK_ID_REUSED.
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    name:
      type: string
      minLength: 1
      pattern: '\S'
      description: 1-100 characters after trimming. Stored trimmed.
    deviceId:
      type: string
      minLength: 1
      description: |
        A device registered to the caller (POST /devices). Any other value is
        403 DEVICE_NOT_OWNED.
    meatType:
      type: string
      minLength: 1
      pattern: '\S'
      description: 1-100 characters after trimming. Stored trimmed.
    weight:
      type: number
      format: double
      exclusiveMinimum: true
      minimum: 0
      maximum: 1000
      description: Pre-cook weight in pounds, greater than 0 and at most 1000.
    targetTemps:
      $ref: '#/StartCookTargetTemperatures'
    notes:
      type: string
      maxLength: 2000

CookListResponse:
  type: object
  description: |
    Response envelope for GET /cooks. Matches CookListResponse in
    libs/api-interfaces/src/lib/cook.ts: bare cook array under `cooks` plus
    continuation-token pagination (NOT wrapped in ApiResponse). There is no
    `total` and no `offset`: cooks are a single-partition Cosmos query, where
    an offset re-charges skipped documents and a total needs a separate COUNT.
  required:
    - cooks
    - limit
    - hasMore
  additionalProperties: false
  properties:
    cooks:
      type: array
      items:
        $ref: '#/Cook'
    limit:
      type: integer
      minimum: 1
      maximum: 100
      description: The page size actually applied, after the API's clamp.
    hasMore:
      type: boolean
    continuationToken:
      type: string
      description: |
        Opaque cursor for the next page. Present exactly when `hasMore` is
        true; send it back unchanged as the `continuationToken` query param.
