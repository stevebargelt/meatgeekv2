# Device schemas.
# GET /devices wraps the array in {devices: [...]} (see
# apps/api/src/functions/devices/get-devices.ts) rather than returning a
# bare array. That wrapper lives in paths/devices.yaml; this file defines
# only the inner entities.

Device:
  type: object
  description: |
    A registered BBQ controller (e.g., MeatGeek V1 'meatgeek3'). Matches
    the Device interface in libs/api-interfaces/src/lib/device.ts.
  required:
    - id
    - userId
    - name
    - model
    - isActive
    - connectionStatus
  additionalProperties: false
  properties:
    id:
      type: string
      description: Device hardware id (e.g., 'meatgeek3'). Also the Cosmos partition key.
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
    userId:
      type: string
      description: |
        Owner: the authenticated caller's `<tenantId>:<objectId>`, set by the
        server from the Easy Auth principal. Never taken from a request.
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Unique among one owner's devices.
    model:
      type: string
      description: Hardware model string (e.g., 'MeatGeek V1').
    location:
      type: string
      description: Free-text location label (e.g., 'Austin, TX').
    lastSeen:
      type: string
      format: date-time
      description: ISO-8601 timestamp of the most recent heartbeat.
    isActive:
      type: boolean
    configuration:
      $ref: '#/DeviceConfiguration'
    connectionStatus:
      $ref: './common.yaml#/ConnectionStatus'
    firmware:
      type: object
      additionalProperties: false
      required:
        - version
        - updateAvailable
      properties:
        version:
          type: string
        updateAvailable:
          type: boolean
    claimedAt:
      type: string
      format: date-time
      description: |
        HAR-130: when the owner claimed the device with its claim code
        (ISO-8601 UTC). Absent on a device registered through POST /devices.

DeviceConfiguration:
  type: object
  description: |
    Per-device tunable settings, including probe-correction offsets that
    are added to raw thermistor readings before the API returns them.
  additionalProperties: false
  properties:
    grillProbeCorrection:
      type: number
      format: double
      description: Offset °F applied to grill probe.
    probe1Correction:
      type: number
      format: double
    probe2Correction:
      type: number
      format: double
    probe3Correction:
      type: number
      format: double
    probe4Correction:
      type: number
      format: double
    temperatureUnit:
      $ref: './common.yaml#/TemperatureUnit'
    pollingInterval:
      type: integer
      minimum: 1
      maximum: 3600
      description: Telemetry sample period in seconds.
    alertSettings:
      type: object
      additionalProperties: false
      required:
        - highTempThreshold
        - lowTempThreshold
        - enableSounds
        - enablePushNotifications
      properties:
        highTempThreshold:
          type: number
          format: double
        lowTempThreshold:
          type: number
          format: double
        enableSounds:
          type: boolean
        enablePushNotifications:
          type: boolean

DeviceListResponse:
  type: object
  description: |
    Response envelope for GET /devices: the array is wrapped under a
    `devices` key rather than returned bare (see
    apps/api/src/functions/devices/get-devices.ts).
  required:
    - devices
  additionalProperties: false
  properties:
    devices:
      type: array
      items:
        $ref: '#/Device'

DeviceConfigurationPatch:
  type: object
  description: |
    A partial DeviceConfiguration, as sent to POST /devices and PATCH
    /devices/{id}. Every field is optional, `alertSettings` included, and each
    one sent replaces only that field. On POST, required DeviceConfiguration
    fields left out are filled from DEFAULT_DEVICE_CONFIGURATION
    (fahrenheit, 30 s polling, thresholds 0, sounds and push off). Unknown
    fields are rejected with 400.
  additionalProperties: false
  properties:
    grillProbeCorrection:
      type: number
      format: double
    probe1Correction:
      type: number
      format: double
    probe2Correction:
      type: number
      format: double
    probe3Correction:
      type: number
      format: double
    probe4Correction:
      type: number
      format: double
    temperatureUnit:
      $ref: './common.yaml#/TemperatureUnit'
    pollingInterval:
      type: integer
      minimum: 1
      maximum: 3600
    alertSettings:
      type: object
      additionalProperties: false
      properties:
        highTempThreshold:
          type: number
          format: double
        lowTempThreshold:
          type: number
          format: double
        enableSounds:
          type: boolean
        enablePushNotifications:
          type: boolean

RegisterDeviceRequest:
  type: object
  description: |
    Body for POST /devices. The owner is the authenticated caller; a body
    `userId` (or any other unlisted field) is rejected with 400.
  required:
    - deviceId
    - name
    - model
  additionalProperties: false
  properties:
    deviceId:
      type: string
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed; must not be blank.
    model:
      type: string
      minLength: 1
      maxLength: 100
    location:
      type: string
      minLength: 1
      maxLength: 200
    configuration:
      $ref: '#/DeviceConfigurationPatch'

ClaimDeviceRequest:
  type: object
  description: |
    Body for POST /devices/claim (HAR-130). The owner is the authenticated
    caller; any unlisted field is rejected with 400. `deviceId`, `name`,
    `location` and `configuration` follow the RegisterDeviceRequest rules.
    `model` may be left out; the device is then stored with "MeatGeek".
  required:
    - deviceId
    - claimCode
    - name
  additionalProperties: false
  properties:
    deviceId:
      type: string
      pattern: '^[A-Za-z0-9._:-]{1,128}$'
    claimCode:
      type: string
      description: |
        The code the device shows, `XXXX-XXXX-XXXX`: 12 Crockford base32
        symbols (`0123456789ABCDEFGHJKMNPQRSTVWXYZ`). Case, hyphens and ASCII
        whitespace do not matter, and `O` reads as `0`, `I` and `L` as `1`.
        Anything that is not then exactly 12 such symbols is a 400.
      example: 7K3M-9QXR-2HTV
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: Trimmed; must not be blank.
    model:
      type: string
      minLength: 1
      maxLength: 100
      default: MeatGeek
    location:
      type: string
      minLength: 1
      maxLength: 200
    configuration:
      $ref: '#/DeviceConfigurationPatch'

UpdateDeviceRequest:
  type: object
  description: |
    Body for PATCH /devices/{id}. All fields optional, at least one required.
    `configuration` merges field by field over the stored configuration.
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    location:
      type: string
      minLength: 1
      maxLength: 200
    configuration:
      $ref: '#/DeviceConfigurationPatch'
