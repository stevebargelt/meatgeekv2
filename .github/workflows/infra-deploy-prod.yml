name: Deploy Prod Infrastructure

# PROD infrastructure: manual/recovery only, and PLAN-ONLY. Unchanged by MG-23.
#
# CI-run reconciliation is the INTENDED STEADY STATE for this repo — it is not
# forbidden on principle, it is simply not activated for prod yet. Where things
# stand today:
#   dev  — ACTIVE under MG-23 (automated dev GitOps reconciliation, CI-run):
#          a PR is validated CREDENTIALLESSLY by ci.yml's validate-infrastructure
#          job — no terraform plan, no Azure identity, no remote state — and the
#          merge to main drives infra-apply-dev.yml, which takes the
#          authoritative plan against real state, applies that exact saved plan,
#          and then fails the run on drift.
#   prod — NOT YET. Activating the CI-run prod apply is MG-25's deliverable and
#          is explicitly out of scope for MG-23. Until then this workflow is
#          dispatched by hand and stops at `plan`: prod state is still
#          greenfield, so an unattended apply here would create the entire prod
#          stack in CI on its first run.
# MG-24 = Terraform reconciliation (operator-run). MG-23 = automated dev GitOps
# reconciliation (CI-run). Activation procedure for dev:
# docs/infrastructure/mg23-live-acceptance.md
#
# Bootstrap, resource-group creation, subscription-scoped configuration and
# disaster recovery stay OPERATOR actions in every environment, including dev.
#
# ---------------------------------------------------------------------------
# MG-25 ACTIVATION PRECONDITION (recorded by MG-58)
# ---------------------------------------------------------------------------
# Prod's apply may NOT be activated until prod carries the SAME post-apply LIVE
# HOST-STORAGE ASSERTION the dev apply job now runs — the "Live host-storage
# gate (fail-closed, on the DEPLOYED site)" step in infra-apply-dev.yml, backed
# by apps/infrastructure/scripts/assert-live-host-storage.sh. Treat it as part
# of MG-25's definition of done, not as a follow-up.
#
# WHY. Prod is built by the SAME module (apps/infrastructure/modules/functions)
# under the SAME pinned provider (hashicorp/azurerm 4.81.0, pinned in
# apps/infrastructure/.terraform.lock.hcl) as dev, so prod inherits the
# IDENTICAL injection at its FIRST apply. Under
# `storage_authentication_type = SystemAssignedIdentity` the provider composes
# and WRITES a scalar `AzureWebJobsStorage` connection string whose AccountKey
# is EMPTY — on create and on every Update — and on read routes that key out of
# `app_settings` into `storage_access_key`. The host resolves the scalar
# connection-string form first and never reaches
# `AzureWebJobsStorage__accountName`, so it authenticates with an unusable key
# against an account with shared keys disabled and host storage is dead: no host
# lock lease, no timer executions, a `Process reporting unhealthy` row every 30
# seconds, and a publish that warns the app appears to be unhealthy.
#
# A PLAN-ONLY PIPELINE IS STRUCTURALLY BLIND TO IT. Because the provider writes
# the key without declaring it and hides it again on read, it is absent from HCL,
# absent from the plan document and absent from post-apply state BY
# CONSTRUCTION. Reviewing this workflow's plan and seeing nothing is not
# evidence of a clean site — on dev, config-clean and site-dirty coexisted with
# a fully green pipeline, which is how a non-fix shipped past eleven checks.
# The live settings of the deployed app are the ONLY surface on which this
# defect is representable.
#
# CONSEQUENCE FOR MG-25. Adding an apply step here WITHOUT also attaching the
# live gate to it ships a prod Function App with dead host storage behind a
# fully green pipeline: precisely the outcome MG-58 exists to prevent, repeated
# in the environment where it costs most. Port the dev step as-is, including its
# fail-loud posture — it deletes exactly the one key on exactly the one app,
# re-asserts, and then FAILS the run, because a silent self-heal would reproduce
# the original invisibility and would also mask a provider upgrade changing the
# behaviour. Its remediation needs management-plane write on the prod app; that
# is an MG-25 identity question, and MG-58 made no RBAC change in any
# environment.
#
# Background / rejected alternatives (declaring the key in `app_settings`; a
# second writer on the app-settings sub-resource):
#   learnings/decisions/mg-58-host-storage-managed-identity.md
# Operator proof sequence (restart, host lock lease, storageHeartbeat timer,
# then the exact-SHA publish) and the live-settings capture:
#   docs/infrastructure/mg58-host-storage-verification.md
#
# MG-58 changed COMMENTS ONLY in this file. This workflow stays
# `workflow_dispatch`-only and plan-only; its behaviour is untouched.
on:
  workflow_dispatch:

# OIDC: this workflow authenticates to Azure via a GitHub-Environment-scoped
# federated credential (subject `<the repo's live sub-claim prefix>:environment:production`),
# NOT a long-lived service-principal secret. The prefix is NOT the literal
# `repo:<owner>/<repo>` — this repository's sub-claim customization injects
# owner/repo ids, so the presented subject differs from that literal and a
# credential federated on it matches nothing (MG-42, AADSTS700213). Bootstrap
# DERIVES it at run time from the repo's live sub-claim customization; see
# resolve_oidc_subject_prefix in apps/infrastructure/bootstrap/bootstrap.sh.
# The dev identities are scoped to
# their own environments (`development-infra-apply`, `development`) — SEPARATE
# identities and subjects — and none can authenticate
# here. `id-token: write` lets azure/login mint the short-lived
# OIDC token; `contents: read` is for checkout.
permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-deploy-prod-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - name: Check for Azure OIDC configuration
        id: check
        # OIDC needs the per-environment client/tenant/subscription IDs published
        # as GitHub Environment variables (not the retired AZURE_CREDENTIALS_PROD
        # SP secret). If any is unset the workflow no-ops instead of failing.
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "Azure OIDC vars (AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID) not set — skipping (not a failure)."
          fi

  deploy-infra:
    needs: guard
    if: needs.guard.outputs.has_creds == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      # ARM_SUBSCRIPTION_ID comes from the authenticated OIDC context — never a
      # hardcoded literal. Terraform's azurerm provider reads it from the env.
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.9'

      - name: Plan Infrastructure (plan-only)
        # PLAN-ONLY — no apply step in this workflow, and MG-23 did not change
        # that. Dev now reconciles through CI (infra-apply-dev.yml); prod's
        # equivalent activation is MG-25. Until then the live greenfield prod
        # apply is the operator's out-of-band step, run after reviewing this plan.
        # Bind the per-env remote backend at init so prod uses its ISOLATED state
        # key (meatgeek-v2/prod.tfstate); -reconfigure handles env switches. The
        # state-account name is derived ONCE from the subscription id by the shared
        # helper and injected as an extra -backend-config (single source, no literal
        # in the hcl). ARM_SUBSCRIPTION_ID is already exported (job env).
        run: |
          cd apps/infrastructure
          STATE_ACCOUNT="$(scripts/state-account-name.sh "$ARM_SUBSCRIPTION_ID")"
          terraform init -reconfigure \
            -backend-config=environments/backend-prod.hcl \
            -backend-config="storage_account_name=$STATE_ACCOUNT"
          terraform plan -var-file=environments/prod.tfvars -out=tfplan
