name: Agent review

# A fresh agent reviews each draft pull request the agent opens, before the owner sees it.
# It posts its findings as inline review comments, pushes fixes, and marks the pull
# request ready for review once the review is clean. Then, if the repository opted in
# (variable AGENT_AUTOMERGE=true) and nothing holds it, it turns on auto-merge, so the
# pull request merges itself when the required checks pass. Held for the owner, with the
# needs-owner label and a comment repeating the owner's steps: steps in the body's
# "🙋 Owner: do this before merging" section (what merging needs first), or a change
# under a held path (workflows, infrastructure, migrations).
# "Check by hand later" items (phone, dev measurements) do not hold; they go into one
# "Checks by hand: #<spec>" issue for the owner.
#
# Adding the agent-review label to any pull request runs it again.
# Installed by the home repo's bin/install-agent-action; change the template there.
# pull_request, not pull_request_target: the action swaps the run's OIDC token for the
# Claude GitHub App's token, and that swap rejects pull_request_target ("Invalid OIDC
# token"). The App token is what lets this run's pushes and its auto-merge start CI and
# the deploy. Cost: a pull request runs this file from its merge ref, so an older pull
# request needs its branch updated before a re-run picks up a template change.
on:
  pull_request:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      vars.AGENT_PAUSED != 'true' && github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository && (
      (github.event.action == 'opened' && github.event.pull_request.draft &&
       github.event.pull_request.user.login == 'claude[bot]') ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent-review'))
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      AUTOMERGE: ${{ vars.AGENT_AUTOMERGE }}
      # Changes under these paths always wait for the owner.
      HOLD_PATHS: '^\.github/workflows/|^apps/infrastructure/'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Decide, before the agent starts, whether a clean review may turn on auto-merge.
      # The hold rules, in one file: the decision before the agent and the check after it
      # use the same code. Prints the reason auto-merge must wait, or nothing.
      - name: Write the hold rules
        run: |
          cat > "$RUNNER_TEMP/hold.sh" <<'EOF'
          set -euo pipefail
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""')
          # The owner's section holds: what the merge itself needs. "Check by hand later" does not.
          # It starts at "🙋 Owner: do this before merging" (or the older "Left undone") and ends at
          # the first blank line after its steps, the next heading, a Closes line, a --- rule, the
          # generated-by footer or "Check by hand".
          # Its steps go, verbatim, into the hold comment.
          awk 'tolower($0) ~ /^[#* ]*(🙋 *)?(owner: do this before merging|left undone)/ {on=1; sub(/^.*([Mm]erging|[Ll]eft undone)[*: ]*/, ""); print; next}
               on && seen && /^[[:space:]]*$/ {on=0}
               on && /[^[:space:]]/ {seen=1}
               on && (/^#/ || /^---/ || /Generated with/ || /claude\.ai\/code/ || tolower($0) ~ /check by hand|^(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]/) {on=0} on' <<<"$body" \
            | grep -viE '^\W*(nothing|none)\b' | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > "$RUNNER_TEMP/owner-steps.md" || true
          [[ "$AUTOMERGE" == true ]] || { echo "this repository has not opted in to auto-merge"; exit 0; }
          ! grep -qE '\w' "$RUNNER_TEMP/owner-steps.md" || { echo "the pull request has steps for the owner"; exit 0; }
          held=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path' | grep -E "$HOLD_PATHS" | head -5 || true)
          [[ -z "$held" ]] || echo "it changes $(echo "$held" | paste -sd, - | sed 's/,/, /g')"
          EOF

      - id: hold
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$REPO" --remove-label agent-review --remove-label needs-owner >/dev/null 2>&1 || true
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""')
          issue=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$body" | head -1 | grep -oE '[0-9]+' || true)
          echo "issue=${issue:-none}" >> "$GITHUB_OUTPUT"
          # Where checks by hand are tracked: the issue's parent (its spec), or the issue itself.
          parent=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){parent{number}}}}' \
            -f o="${REPO%/*}" -f r="${REPO#*/}" -F n="${issue:-0}" --jq '.data.repository.issue.parent.number // empty' 2>/dev/null || true)
          echo "anchor=${parent:-${issue:-none}}" >> "$GITHUB_OUTPUT"
          reason=$(bash "$RUNNER_TEMP/hold.sh")
          echo "Auto-merge before review: ${reason:-allowed}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.6.app/Contents/Developer"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project apps/ios/MeatGeek.xcodeproj -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" -disablePackageRepositoryCache -skipPackagePluginValidation

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/data-pusher/go.mod
          cache: false

      # Every Bash command is allowed: the runner is thrown away after the run.
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The pull request was opened by claude[bot]; labels may come from github-actions.
          allowed_bots: "claude,claude[bot],github-actions,github-actions[bot]"
          restrict_untrusted_prs: "false"
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: mattpocock-skills@claude-plugins-official
          # Same model and effort as the owner's interactive sessions; the action defaults to Sonnet.
          settings: '{"effortLevel": "medium"}'
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,Skill,TodoWrite,WebFetch,Bash"
            --append-system-prompt "No one is watching this run. Run every sub-agent, task and command in the foreground and wait for it: the session ends the moment you stop, and anything left in the background is killed. Your GitHub access (gh, git push) expires about 60 minutes after the run starts, so push your work by minute 50 and say in your reply what is left. Swift packages are already resolved. Pass -clonedSourcePackagesDirPath \"${{ runner.temp }}/SourcePackages\" -disablePackageRepositoryCache -disableAutomaticPackageResolution -skipPackagePluginValidation to every xcodebuild call; do not re-resolve packages or change git config."

          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }},
            written by another agent for issue #${{ steps.hold.outputs.issue }}. You did not write it: review it
            as a stranger would. Read AGENTS.md first. No one is watching.
            Run every sub-agent, task and command in the foreground and wait for it: this session ends the
            moment you stop, and anything still running in the background is killed with it.
            Your GitHub access (gh, git push) expires about 60 minutes after this run starts. Push your work and
            update the pull request by minute 50 at the latest; anything still unfinished then goes in the body's "🙋 Owner" section.

            1. Review it with the code-review skill: the diff against `origin/${{ github.event.pull_request.base.ref }}`,
               with the issue as the spec (`gh issue view ${{ steps.hold.outputs.issue }}`). Check claims in the
               pull request body against the code, not just the code against the issue.
            2. Post the findings as one review with inline comments: write the review as JSON
               (`{"event": "COMMENT", "body": "...", "comments": [{"path": "...", "line": N, "body": "..."}]}`)
               to a file and run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --method POST --input <file>`.
               Post nothing if there are no findings.
            3. Fix every real finding on this branch. Run the checks AGENTS.md lists for CI; they must pass.
               Commit following AGENTS.md's conventions and push. Reply to each inline comment with what you
               changed, or why it needs no change. Never run `az`, `terraform apply` or `supabase`, and never deploy.
            4. Sort the pull request body's sections, and fix them if the author misfiled anything:
               - "## 🙋 Owner: do this before merging", right after the Closes line at the top: only what merging
                 needs first, such as a missing step, a secret, an edit to `.github/workflows/` the agent may not
                 push, or a fix that needs the owner's account. Numbered steps, each saying exactly what to edit
                 or run and how to tell it worked; rewrite any step that is vague. Keep the steps one list with
                 no blank lines inside it, and a `##` heading after the section. If there are none, the section
                 is the single line "Nothing, merges itself when green." (An older body's "Left undone" section
                 becomes this one.)
               - "## Check by hand later": proofs that can only happen after merging, such as on a real phone, a
                 measurement on dev, or live delivery. These do not hold the merge. Each item gives the exact
                 steps and what to look for, or links the doc section that has them; never just the check's name.
               If there are checks by hand, add each as a `- [ ] <check>: <its steps, or the link to them> (from #${{ github.event.pull_request.number }})`
               line to the open issue titled `Checks by hand: #${{ steps.hold.outputs.anchor }}` (find it with
               `gh issue list --state open --label checks-by-hand --json number,title`, match the title exactly, and
               create it with the labels `checks-by-hand` and `ready-for-human` if there is none).
            5. When the review is clean (no real findings left, checks pass), run `gh pr ready ${{ github.event.pull_request.number }}`.
               Then run `gh pr merge ${{ github.event.pull_request.number }} --auto --squash`, so it merges itself once the
               required checks pass, only if all of these hold for the body as it now stands: the owner section says
               "Nothing", the pull request changes no path matching `${{ env.HOLD_PATHS }}`, and the repository variable
               AGENT_AUTOMERGE is `true` (it is `${{ vars.AGENT_AUTOMERGE }}`). Otherwise leave it: the workflow
               adds `needs-owner` and comments the owner's steps.

            If it is still not clean after two rounds of fixes, leave the pull request as a draft and comment
            on it with what is left and why.

      # A run must leave the pull request ready for review, or a comment saying why not.
      - name: Check the result
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          draft=$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq .isDraft)
          if [[ "$draft" == false ]]; then echo "#$PR is ready for review" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          said="(no transcript)"
          if [[ -n "${EXECUTION_FILE:-}" && -f "$EXECUTION_FILE" ]]; then
            said=$(jq -r '[.[] | select(.type == "result")] | last | .result // "(no final message)"' "$EXECUTION_FILE" | head -c 3000)
          fi
          {
            echo "The review run ended with this pull request still a draft: $RUN_URL. Add the \`agent-review\` label to run it again."
            echo; echo "**The reviewer's last message:**"; echo
            while IFS= read -r line; do echo "> $line"; done <<<"$said"
          } > "$RUNNER_TEMP/review.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/review.md"

      # The same hold rules, from the code, on the body as the review left it. When one
      # applies: turn auto-merge off if the agent turned it on, and hand a ready pull request
      # to the owner with a comment that repeats the owner's steps, so the notification has them.
      - name: Enforce the holds
        if: always()
        run: |
          set -euo pipefail
          [[ "$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" == OPEN ]] || exit 0
          reason=$(bash "$RUNNER_TEMP/hold.sh")
          view=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest,isDraft)
          auto=$(jq '.autoMergeRequest != null' <<<"$view"); draft=$(jq .isDraft <<<"$view")
          echo "Auto-merge after review: ${reason:-allowed} (auto-merge on: $auto)" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ -n "$reason" ]] || exit 0
          note=""
          if [[ "$auto" == true ]]; then gh pr merge "$PR" --repo "$REPO" --disable-auto; note=" (Auto-merge turned back off.)"; fi
          [[ "$draft" == false ]] || exit 0
          gh pr edit "$PR" --repo "$REPO" --add-label needs-owner
          {
            echo "## 🙋 Needs the owner before merging"; echo
            echo "Why: $reason.$note"
            if grep -qE '\w' "$RUNNER_TEMP/owner-steps.md"; then echo; cat "$RUNNER_TEMP/owner-steps.md"; fi
          } > "$RUNNER_TEMP/hold.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/hold.md"

      # The transcript, encrypted to the owner's age key; bin/agent-logs in the home repo reads it.
      - name: Save the transcript
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          KEY: ${{ vars.AGENT_LOG_KEY }}
        run: |
          set -euo pipefail
          [[ -f "$EXECUTION_FILE" ]] || { echo "no transcript"; exit 0; }
          [[ -n "$KEY" ]] || { echo "::warning::AGENT_LOG_KEY is not set, so the transcript is not saved"; exit 0; }
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) p=linux-amd64 ;; Linux-ARM64) p=linux-arm64 ;; macOS-ARM64) p=darwin-arm64 ;; *) p=darwin-amd64 ;;
          esac
          curl -fsSL "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-$p.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/age/age" -r "$KEY" -o "$RUNNER_TEMP/transcript.json.age" "$EXECUTION_FILE"
      - uses: actions/upload-artifact@v4
        if: always() && steps.claude.outputs.execution_file != ''
        with:
          name: agent-transcript-${{ github.event.pull_request.number }}-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transcript.json.age
          retention-days: 30
          if-no-files-found: ignore
