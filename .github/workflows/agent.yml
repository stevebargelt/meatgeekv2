name: Agent

# Runs Claude Code on an issue labelled ready-for-agent, once nothing blocks it.
# The run ends in a draft pull request, which agent-review.yml reviews next, or,
# when the agent can't finish, in a comment and the ready-for-human label.
#
# - Adding ready-for-agent starts a run, but only when every issue blocking it is
#   closed as completed: GitHub's blocked-by links, plus any "Blocked by: #n" line
#   in the body. A blocked issue is skipped before Claude starts, without a comment.
# - Closing an issue as completed releases the ready-for-agent issues it was
#   blocking: each is re-checked and started if nothing else blocks it.
# - "Run workflow" (or `gh workflow run agent.yml -f issue=N`) starts one by hand,
#   through the same checks.
# - While the agent works the issue carries the agent-working label and a comment
#   linking the run; the label comes off when the run ends.
# - Setting the repository variable AGENT_PAUSED to true stops all of it.
# Installed by the home repo's bin/install-agent-action; change the template there.
on:
  issues:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# One run per issue; a second start while one is going waits, then re-checks.
concurrency:
  group: agent-issue-${{ github.event.inputs.issue || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # An issue closed as completed: start the agent on the ready-for-agent issues it was blocking.
  release:
    if: >-
      vars.AGENT_PAUSED != 'true' && github.event_name == 'issues' &&
      github.event.action == 'closed' && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CLOSED: ${{ github.event.issue.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - run: |
          set -euo pipefail
          native=$(gh api "repos/$REPO/issues/$CLOSED/dependencies/blocking" --paginate --jq '.[].number' || true)
          text=$(gh issue list --repo "$REPO" --state open --label ready-for-agent --limit 200 --json number,body \
              --jq '.[] | "\(.number) \(.body // "" | @base64)"' |
            while read -r n b; do
              base64 -d <<<"$b" | grep -iE '^\W*blocked by\W*:' | grep -qE "#$CLOSED([^0-9]|$)" && echo "$n" || true
            done)
          for n in $(printf '%s\n' $native $text | sort -un); do
            labels=$(gh api "repos/$REPO/issues/$n" --jq 'select(.state=="open") | [.labels[].name] | join(",")')
            if [[ ",$labels," == *",ready-for-agent,"* ]]; then
              echo "#$CLOSED closed: starting the agent on #$n (it re-checks its other blockers)"
              gh workflow run agent.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f issue="$n"
            fi
          done

  # Is this issue ready? Open, labelled ready-for-agent, not ready-for-human, no open
  # blocker, and no open pull request already closing it.
  gate:
    if: >-
      vars.AGENT_PAUSED != 'true' && (github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ready-for-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue: ${{ steps.check.outputs.issue }}
      ready: ${{ steps.check.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.inputs.issue || github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::issue must be a number"; exit 1; }
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          skip() { echo "Not starting #$ISSUE: $1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }

          read -r state labels < <(gh api "repos/$REPO/issues/$ISSUE" --jq '"\(.state) ,\([.labels[].name]|join(",")),"')
          # Runs for one issue never overlap (concurrency group), so an agent-working label
          # seen here was left by a run that died before its result step.
          if [[ "$labels" == *",agent-working,"* ]]; then
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label agent-working >/dev/null
          fi
          [[ "$state" == open ]] || skip "it is $state"
          [[ "$labels" == *",ready-for-agent,"* ]] || skip "it is not labelled ready-for-agent"
          [[ "$labels" != *",ready-for-human,"* ]] || skip "it is labelled ready-for-human"

          native=$(gh api "repos/$REPO/issues/$ISSUE/dependencies/blocked_by" --paginate --jq '.[].number' || true)
          text=$(gh api "repos/$REPO/issues/$ISSUE" --jq '.body // ""' | grep -iE '^\W*blocked by\W*:' | grep -oE "#[0-9]+" | tr -d "#" || true)
          open=""
          for b in $(printf '%s\n' $native $text | sort -un); do
            [[ "$b" == "$ISSUE" ]] && continue
            read -r bs reason < <(gh api "repos/$REPO/issues/$b" --jq '"\(.state) \(.state_reason // "none")"')
            [[ "$bs" == closed && "$reason" == completed ]] || open+=" #$b($bs${reason:+, $reason})"
          done
          [[ -z "$open" ]] || skip "blocked by$open"

          # Not --search: the search index lags new pull requests by seconds to minutes.
          pr=$(gh pr list --repo "$REPO" --state open --limit 200 --json number,body \
            --jq "[.[] | select(.body // \"\" | test(\"(?i)\\\\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #$ISSUE\\\\b\"))][0].number // empty")
          [[ -z "$pr" ]] || skip "pull request #$pr already closes it"
          echo "#$ISSUE is ready" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # Visible while the agent works: the label (in lists, searches, and on hover in a
          # parent's sub-issue list) and a comment linking the live run.
          gh issue edit "$ISSUE" --repo "$REPO" --add-label agent-working >/dev/null
          gh issue comment "$ISSUE" --repo "$REPO" --body "Agent started: $RUN_URL" >/dev/null

  implement:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.6.app/Contents/Developer"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project apps/ios/MeatGeek.xcodeproj -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" -disablePackageRepositoryCache -skipPackagePluginValidation

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/data-pusher/go.mod
          cache: false

      # Every Bash command is allowed: Bash(node:*) alone already runs arbitrary code,
      # and the runner is thrown away after the run. A narrow list only made runs fail.
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The release job starts runs with the workflow token, so their actor is the
          # github-actions bot; the action refuses bots it is not told to allow.
          allowed_bots: "github-actions,github-actions[bot]"
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: mattpocock-skills@claude-plugins-official
          # Same model and effort as the owner's interactive sessions; the action defaults to Sonnet.
          settings: '{"effortLevel": "medium"}'
          claude_args: |
            --model claude-opus-5-5
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,Skill,TodoWrite,WebFetch,Bash"
            --append-system-prompt "Swift packages are already resolved. Pass -clonedSourcePackagesDirPath \"${{ runner.temp }}/SourcePackages\" -disablePackageRepositoryCache -disableAutomaticPackageResolution -skipPackagePluginValidation to every xcodebuild call; do not re-resolve packages or change git config."
          prompt: |
            You are working on issue #${{ needs.gate.outputs.issue }} in ${{ github.repository }}, with no one watching.
            Nothing blocks it: every issue it was blocked by is closed as completed. Read AGENTS.md first and follow it.

            1. Read the issue with `gh issue view ${{ needs.gate.outputs.issue }} --comments`.
            2. Implement what it asks ("What done looks like", when it has one), test-first where it has
               behaviour to test. The checks AGENTS.md lists for CI must pass. Never run `az`, `terraform apply`
               or `supabase`, and never deploy: a step that needs the owner's account or device is left undone
               and listed in the pull request.
            3. Commit on your branch following AGENTS.md's commit conventions, referencing `#${{ needs.gate.outputs.issue }}`.
            4. Push, then `gh pr create --draft --base ${{ github.event.repository.default_branch }} --fill-first` with a
               body that starts with `Closes #${{ needs.gate.outputs.issue }}` and ends with a "Left undone" section:
               anything you did not do and why, or "Nothing". A separate review agent reviews the draft next.

            If you cannot get the checks green, do not open a pull request. Instead comment
            on the issue with what you tried and where it stuck, and run
            `gh issue edit ${{ needs.gate.outputs.issue }} --remove-label ready-for-agent --add-label ready-for-human`.

      # The prompt tells the agent to open a pull request or park the issue. This makes
      # sure one of the two happened, so a run never ends silently.
      - name: Check the result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label agent-working >/dev/null || true
          # Not --search: the search index lags the pull request the agent just opened.
          pr=$(gh pr list --repo "$REPO" --state open --limit 200 --json url,body \
            --jq "[.[] | select(.body // \"\" | test(\"(?i)\\\\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #$ISSUE\\\\b\"))][0].url // empty")
          if [[ -n "$pr" ]]; then echo "#$ISSUE: $pr" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          labels=$(gh api "repos/$REPO/issues/$ISSUE" --jq '[.labels[].name] | join(",")')
          if [[ ",$labels," != *",ready-for-agent,"* ]]; then echo "#$ISSUE: parked by the agent" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          # What the agent last said, and what it was stopped from running, from its transcript.
          said="(no transcript)"; denied=""
          if [[ -n "${EXECUTION_FILE:-}" && -f "$EXECUTION_FILE" ]]; then
            said=$(jq -r '[.[] | select(.type == "result")] | last | .result // "(no final message)"' "$EXECUTION_FILE" | head -c 3000)
            denied=$(jq -r '[.[] | select(.type == "result")] | last | .permission_denials // [] | .[] |
              "- `\(.tool_name)`: `\((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:160])`"' "$EXECUTION_FILE" | sort -u | head -20)
          fi
          {
            echo "The agent run ended without a pull request: $RUN_URL. Moved to ready-for-human."
            echo; echo "**Its last message:**"; echo; echo "$said" | sed 's/^/> /'
            if [[ -n "$denied" ]]; then echo; echo "**Tool calls it was not allowed to make:**"; echo "$denied"; fi
          } > "$RUNNER_TEMP/parked.md"
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/parked.md"
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label ready-for-agent --add-label ready-for-human
          echo "#$ISSUE: no pull request; moved to ready-for-human" | tee -a "$GITHUB_STEP_SUMMARY"
