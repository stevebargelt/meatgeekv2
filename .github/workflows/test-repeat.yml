name: test-repeat

# HAR-107 (goal HAR-106: every test in MeatGeek is deterministic). Runs test
# suites 50 times in a row, with the race detector on the Go suites, and reports
# one table in the job summary. A suite that fails once in 50 runs is flaky, and
# this is where that shows.
#
# It runs on main, not on pull requests: it never gated a merge, and at 18 to 28
# minutes it was the longest wait on a pull request.
#
#   - nightly: the suites affected by what changed on main since the last
#     successful nightly run (all of them when there is none);
#   - weekly (Sunday): every suite, so a flake brought in by a dependency or a
#     runner image change shows even in code nobody touched;
#   - by hand (workflow_dispatch): `all` runs every suite, `load` adds the
#     8-copy pass.
#
# Selection is tools/test-repeat/suites.mjs's path globs matched against the
# changed files (`git diff --name-only <base>...HEAD`). A change to the harness
# (tools/test-repeat/** or this file) runs every suite ONCE, proving each
# command still works in CI without putting not-yet-fixed suites through 50
# runs.
#
# A failed run opens an issue labelled needs-triage for each failing suite, or
# comments on that suite's open one. It never fails main or blocks a merge.
#
# No secret, no environment, no OIDC permission. The token is `contents: read`,
# plus `actions: read` in select (to find the last nightly run) and
# `issues: write` in report.
on:
  schedule:
    - cron: '17 7 * * 1-6' # nightly: what changed since the last nightly run
    - cron: '17 7 * * 0' # weekly: every suite
  workflow_dispatch:
    inputs:
      all:
        description: Run every suite 50 times
        type: boolean
        default: false
      load:
        description: Add one pass of each selected suite with 8 copies at once
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-repeat
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  select:
    name: test-repeat select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      matrix: ${{ steps.select.outputs.matrix }}
      has_matrix: ${{ steps.select.outputs.has_matrix }}
      emulator_matrix: ${{ steps.select.outputs.emulator_matrix }}
      has_emulator: ${{ steps.select.outputs.has_emulator }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The three-dot diff needs the merge base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Harness self-tests
        # Node built-ins only: nothing to install.
        run: node tools/test-repeat/run-tests.mjs

      - name: Find what to compare against
        # The last successful scheduled run's commit. None (the first run, or
        # every earlier one failed): every suite is selected.
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 7 * * 0') || inputs.all == true }}
          LOAD: ${{ inputs.load == true }}
        run: |
          labels='[]'
          if [ "$ALL" = "true" ]; then labels='["test-repeat:all"]'; fi
          if [ "$LOAD" = "true" ]; then labels="$(jq -c '. + ["test-repeat:load"]' <<<"$labels")"; fi
          base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test-repeat.yml --branch main \
            --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Every suite, 50 times: compare HEAD with itself, so no file counts
            # as changed (diffing from the first commit would list the whole
            # repository, and count the harness as changed, so every suite
            # would run once).
            echo "No earlier successful nightly run on main: every suite runs."
            labels="$(jq -c '. + ["test-repeat:all"] | unique' <<<"$labels")"
            base="$(git rev-parse HEAD)"
          fi
          echo "Base: $base; labels: $labels"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"

      - name: Select affected suites
        id: select
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          LABELS: ${{ steps.base.outputs.labels }}
        run: >-
          node tools/test-repeat/test-repeat.mjs select
          --affected "$BASE_SHA"
          --labels "$LABELS"
          --out "$RUNNER_TEMP/selection.json"
          --github-output

      - name: Keep the selection for the summary
        # As a file, not an environment variable: a long changed-files list
        # (a week of main) is over the size Linux allows one variable.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selection
          path: ${{ runner.temp }}/selection.json
          retention-days: 7

  repeat:
    needs: select
    if: needs.select.outputs.has_matrix == 'true'
    # Prefixed: the bare suite ids (api, web-e2e, ...) are also ci.yml job
    # names, and a required check is matched by name.
    name: test-repeat ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Shards keep a job near 25 minutes; this is the hang backstop.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ matrix.npm && 'npm' || '' }}

      - name: Enable corepack (use packageManager-pinned npm)
        if: matrix.npm
        run: corepack enable

      - name: Install dependencies
        if: matrix.npm
        run: npm ci

      - name: Setup Go
        if: matrix.go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ matrix.goModFile }}
          cache-dependency-path: ${{ matrix.goSumFile }}

      - name: Setup Terraform
        if: matrix.terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '~1.9'
          # The wrapper intercepts stdin, which hangs `terraform fmt -`
          # (bootstrap.test.sh). Same setting as validate-infrastructure.
          terraform_wrapper: false

      - name: Resolve the installed @playwright/test version
        if: matrix.chromium
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: matrix.chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium and its system dependencies
        if: matrix.chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        env:
          SUITE: ${{ matrix.suite }}
          RUNS: ${{ matrix.runs }}
          SHARD: ${{ matrix.shard }}
          PARALLEL: ${{ matrix.parallel }}
          KIND: ${{ matrix.kind }}
          KEY: ${{ matrix.key }}
        run: >-
          node tools/test-repeat/test-repeat.mjs run "$SUITE"
          --runs "$RUNS" --shard "$SHARD" --parallel "$PARALLEL" --kind "$KIND"
          --result "$RUNNER_TEMP/test-repeat/results/$KEY.json"
          --log-dir "$RUNNER_TEMP/test-repeat/logs/$KEY"

      - name: Upload result and failing-run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-repeat-${{ matrix.key }}
          path: ${{ runner.temp }}/test-repeat/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure() && matrix.chromium
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.key }}
          path: dist/.playwright/web-e2e
          if-no-files-found: ignore
          retention-days: 7

  # The api Cosmos emulator suite, in its own job because it needs the
  # emulator: the Windows-native one on windows-2025, started and measured by
  # .github/scripts/cosmos-emulator.ps1, exactly as ci.yml's
  # api-cosmos-emulator job does; keep the two in step. The classic Linux
  # emulator image crashed natively under this suite (HAR-113).
  repeat-emulator:
    needs: select
    if: needs.select.outputs.has_emulator == 'true'
    # Prefixed: the bare suite ids (api, web-e2e, ...) are also ci.yml job
    # names, and a required check is matched by name.
    name: test-repeat ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.emulator_matrix) }}
    steps:
      - name: Keep LF line endings
        # The specs parse Terraform and JSON fixtures from the working tree.
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Start the Cosmos emulator (bounded)
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP 'cosmos-emulator.pem'
          ./.github/scripts/cosmos-emulator.ps1 start $cert
          "NODE_EXTRA_CA_CERTS=$cert" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run ${{ matrix.name }}
        shell: pwsh
        env:
          SUITE: ${{ matrix.suite }}
          RUNS: ${{ matrix.runs }}
          SHARD: ${{ matrix.shard }}
          PARALLEL: ${{ matrix.parallel }}
          KIND: ${{ matrix.kind }}
          KEY: ${{ matrix.key }}
        run: |
          $sampler = Start-Process pwsh -PassThru -NoNewWindow -ArgumentList @(
            '-NoProfile', '-File', './.github/scripts/cosmos-emulator.ps1',
            'sample', (Join-Path $env:RUNNER_TEMP 'cosmos-emulator/stats.log'))
          try {
            node tools/test-repeat/test-repeat.mjs run $env:SUITE `
              --runs $env:RUNS --shard $env:SHARD --parallel $env:PARALLEL --kind $env:KIND `
              --result "$env:RUNNER_TEMP/test-repeat/results/$env:KEY.json" `
              --log-dir "$env:RUNNER_TEMP/test-repeat/logs/$env:KEY"
            $code = $LASTEXITCODE
          } finally {
            Stop-Process -Id $sampler.Id -ErrorAction SilentlyContinue
          }
          exit $code

      - name: Cosmos emulator diagnostics
        # HAR-113: the emulator's own account of a failed pass. See ci.yml's
        # api-cosmos-emulator.
        if: failure()
        shell: pwsh
        run: ./.github/scripts/cosmos-emulator.ps1 diagnose (Join-Path $env:RUNNER_TEMP 'cosmos-emulator')

      - name: Upload result and failing-run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-repeat-${{ matrix.key }}
          path: ${{ runner.temp }}/test-repeat/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cosmos emulator diagnostics
        # Its own artifact: the summary job merges every test-repeat-* artifact.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cosmos-emulator-${{ matrix.key }}
          path: ${{ runner.temp }}/cosmos-emulator/
          if-no-files-found: ignore
          retention-days: 7

  # One table for the whole run. Fails when any selected pass failed or never
  # reported, so this is the one check to require.
  summary:
    name: test-repeat summary
    needs: [select, repeat, repeat-emulator]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download results
        # Nothing to download when nothing was selected, or when every job
        # died before uploading; the summary reports the missing results.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-repeat-*
          merge-multiple: true
          path: ${{ runner.temp }}/test-repeat

      - name: Download the selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selection
          path: ${{ runner.temp }}

      - name: Summarise
        run: |
          node tools/test-repeat/test-repeat.mjs summary \
            --selection "$RUNNER_TEMP/selection.json" \
            --results "$RUNNER_TEMP/test-repeat/results" \
            --step-summary

  # A failed run is reported as an issue per failing suite (needs-triage), or a
  # comment on that suite's open issue. Main stays green: a flake is a ticket,
  # not a reason to stop deploys.
  report:
    name: test-repeat report
    needs: [select, repeat, repeat-emulator, summary]
    if: always() && needs.select.result == 'success' && needs.summary.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-repeat-*
          merge-multiple: true
          path: ${{ runner.temp }}/test-repeat

      - name: Open or update an issue per failing suite
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ runner.temp }}/test-repeat/results
        run: |
          # A result with a failed run, or a load copy that failed. A run whose
          # jobs reported nothing at all becomes one issue for the whole run.
          failed="$(node -e '
            const fs = require("fs"), path = require("path");
            const dir = process.env.RESULTS;
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith(".json")) : [];
            const ids = new Set();
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              if (r.failedRun !== null || (r.copies || []).some(c => c.failedRun !== null)) ids.add(r.suite);
            }
            console.log([...ids].sort().join("\n"));
          ')"
          printf '%s\n' "${failed:-}" | while IFS= read -r suite; do
            # No suite failed: the run itself did (a job reported nothing, or
            # the summary could not run). One issue for the workflow.
            if [ -n "$suite" ]; then title="test-repeat: $suite failed on main"; else suite="the run"; title="test-repeat: the scheduled run failed on main"; fi
            body="The scheduled test-repeat run on \`${GITHUB_SHA:0:7}\` failed for \`$suite\`: $RUN_URL. The run summary has the first failing run, and the artifacts have its log."
            number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
              | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label needs-triage --body "$body"
            fi
          done
