name: Deploy Dev App

# MG-36 / HAR-13 — deploy every green main commit to the DEV Function App, then
# prove the deployed API works with the live acceptance suite.
#
#   CI/CD Pipeline (push to main, green)
#     -> Apply Dev Infrastructure (workflow_run; applies the same commit)
#       -> Deploy Dev App (this file; workflow_run)
#            deploy      publish the API to the dev Function App
#            acceptance  `nx run api:acceptance` against it, as the same identity
#            web-acceptance  (HAR-101, in parallel with acceptance) the live
#                        browser proof, `nx e2e-live web-e2e`: the PRODUCTION web
#                        app (Vercel builds main on its own), signed in as the
#                        TOTP acceptance user, sees a reading pushed by
#                        simdevice as <simulated_device_id>-web. The app-publish
#                        login only manages that device in IoT Hub.
#
# Chaining after the infra apply, not after CI, means the infrastructure for a
# commit (including the Easy Auth caller list the acceptance job depends on) is
# applied before the API for that commit is published and tested.
#
# CREDENTIALS NEVER MEET UNMERGED CODE. The only triggers are workflow_run and
# workflow_dispatch (main only). `workflow_run` always executes the workflow file
# from the default branch, and every job checks out a commit that is on main and
# has a green CI/CD Pipeline push run (verified below, on every trigger).
#
# Docs: docs/development/ci-cd.md (Dev app deploy) and
#       docs/development/live-acceptance.md (the suite and the browser proof).
on:
  workflow_run:
    workflows: ['Apply Dev Infrastructure']
    types: [completed]
  # Manual re-run of the current main tip. The deploy job refuses any ref other
  # than main and any commit without a successful CI/CD Pipeline push run.
  workflow_dispatch:

# id-token: write  — azure/login and terraform mint an OIDC token for the dev
#                    app-publish identity (development environment, in all
#                    three jobs); the acceptance suite step mints one more for
#                    the zero-role acceptance peer identity (HAR-61/HAR-65).
# contents: read   — checkout and the main-tip lookups.
# actions: read    — look up the commit's CI/CD Pipeline runs.
permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_VERSION: '24'
  # Let corepack download the packageManager-pinned npm without an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Same Core Tools pin as app-deploy-prod.yml.
  FUNC_CORE_TOOLS_VERSION: '4.12.1'

# One dev deploy at a time; never cancel a publish half way. GitHub keeps only
# the newest pending run in the group, which is the one worth deploying.
concurrency:
  group: app-deploy-dev-development
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    outputs:
      deployed: ${{ steps.publish.outputs.deployed }}
      sha: ${{ steps.target.outputs.sha }}
      hostname: ${{ steps.tfout.outputs.function_app_hostname }}
      audience: ${{ steps.tfout.outputs.functions_auth_audience }}
      iot_hub_name: ${{ steps.tfout.outputs.iot_hub_name }}
      iot_hub_hostname: ${{ steps.tfout.outputs.iot_hub_hostname }}
      simulated_device_id: ${{ steps.tfout.outputs.simulated_device_id }}
    env:
      # Terraform reads dev state as the app-publish identity over OIDC. Without
      # ARM_USE_OIDC the azurerm backend falls back to the az CLI session, which
      # it refuses for a service principal. bootstrap.sh grants this identity
      # Storage Blob Data Reader on the tfstate-dev container for this read.
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
      ARM_USE_OIDC: 'true'
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
    steps:
      # Which commit this run deploys. workflow_run: the commit the infra apply
      # ran for. workflow_dispatch: the dispatched ref, which must be main.
      - name: Resolve the target commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
              echo "Refusing: workflow_dispatch is allowed from main only (got $DISPATCH_REF)." >&2
              exit 1
            fi
            SHA="$DISPATCH_SHA"
          else
            SHA="$RUN_SHA"
          fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "Could not resolve the commit to deploy — refusing." >&2
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target commit: $SHA"

      # The commit must have a successful CI/CD Pipeline run for a push to main.
      # This is checked on BOTH triggers: an `Apply Dev Infrastructure` run that
      # skipped as superseded reports main's tip as its head_sha, and that tip's
      # own CI may have failed or still be running. Dispatch refuses (red);
      # workflow_run skips (green, nothing deployed) because that commit's own
      # CI result is what decides whether it ships.
      - name: Require a green CI/CD Pipeline push run for the commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&status=success" --jq .total_count)"
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "CI/CD Pipeline succeeded for $SHA on a push to main."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Refusing: $SHA has no successful CI/CD Pipeline push run on main." >&2
            exit 1
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
            echo "$SHA has no successful CI/CD Pipeline push run on main — skipping deploy (not a failure)."
          fi

      # Stale-SHA guard, as in app-deploy-prod.yml: deploy only main's tip.
      - name: Stale-SHA guard (deploy only the current main tip)
        id: freshness
        if: steps.ci.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_TIP="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "Target commit: $SHA"
          echo "Current main:  $CURRENT_TIP"
          if [ "$SHA" = "$CURRENT_TIP" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Target is the current main tip — proceeding."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "main has advanced past the target — skipping deploy (not a failure)."
          fi

      - name: Checkout the target commit
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        if: steps.freshness.outputs.fresh == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.freshness.outputs.fresh == 'true'
        run: npm ci

      - name: Build api
        if: steps.freshness.outputs.fresh == 'true'
        run: npx nx build api

      - name: Verify Functions package
        if: steps.freshness.outputs.fresh == 'true'
        run: node apps/api/tools/verify-func-package.js dist/apps/api

      # Flex Consumption runs the package as uploaded (--no-build), so its
      # runtime dependencies must be in it.
      - name: Install the package's runtime dependencies
        if: steps.freshness.outputs.fresh == 'true'
        working-directory: dist/apps/api
        run: npm install --omit=dev --ignore-scripts

      - name: Pin Azure Functions Core Tools
        if: steps.freshness.outputs.fresh == 'true'
        run: npm i -g "azure-functions-core-tools@${FUNC_CORE_TOOLS_VERSION}"

      - name: Setup Terraform
        if: steps.freshness.outputs.fresh == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '~1.9'
          terraform_wrapper: false

      # The dev APP-PUBLISH identity: Website Contributor on the dev Function App
      # plus the Flex deployment-package container role, and read-only on dev
      # state. Not the infra-apply identity.
      - name: Azure login (OIDC — dev app-publish identity)
        if: steps.freshness.outputs.fresh == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Never hard-code the Function App or the hub: read the app's name, host,
      # the API audience, the IoT Hub name and hostname, and the standing
      # simulated device id from the dev Terraform state.
      - name: Resolve Function App, API audience, IoT Hub and simulated device (Terraform outputs)
        id: tfout
        if: steps.freshness.outputs.fresh == 'true'
        working-directory: apps/infrastructure
        run: |
          set -euo pipefail
          STATE_ACCOUNT="$(scripts/state-account-name.sh "$ARM_SUBSCRIPTION_ID")"
          terraform init -input=false -reconfigure -lockfile=readonly \
            -backend-config=environments/backend-dev.hcl \
            -backend-config="storage_account_name=$STATE_ACCOUNT"
          for OUT in function_app_name function_app_hostname functions_auth_audience iot_hub_name iot_hub_hostname simulated_device_id; do
            VALUE="$(terraform output -raw "$OUT")"
            if [ -z "$VALUE" ]; then
              echo "Terraform output $OUT is empty — aborting deploy." >&2
              exit 1
            fi
            echo "$OUT=$VALUE" >> "$GITHUB_OUTPUT"
            echo "$OUT: $VALUE"
          done

      # Authoritative freshness gate, right before publish: main can advance
      # during the build.
      - name: Re-verify main tip (final freshness gate before publish)
        id: freshness_final
        if: steps.freshness.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_TIP="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "Target commit: $SHA"
          echo "Current main:  $CURRENT_TIP"
          if [ "$SHA" = "$CURRENT_TIP" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Still the current main tip — publishing."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "main advanced during the build — skipping publish (not a failure)."
          fi

      # The publish method proven by hand in MG-21. `nx deploy api` does not work
      # on Flex Consumption. `--javascript` is required because Core Tools reads
      # the legacy FUNCTIONS_WORKER_RUNTIME setting, which Flex correctly lacks.
      - name: Publish to the dev Function App
        id: publish
        if: steps.freshness.outputs.fresh == 'true' && steps.freshness_final.outputs.fresh == 'true'
        working-directory: dist/apps/api
        env:
          FUNCTION_APP_NAME: ${{ steps.tfout.outputs.function_app_name }}
        run: |
          set -euo pipefail
          func azure functionapp publish "$FUNCTION_APP_NAME" --javascript --no-build
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: deploy
    # Skipped when the deploy job published nothing (stale or not CI-green).
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    # 40, not 15: a later HAR-39 proof sends up to 8,640 readings in one run.
    timeout-minutes: 40
    environment: development
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      # simdevice (HAR-40) sends readings to IoT Hub as the simulated device.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/data-pusher/go.mod
          cache-dependency-path: apps/data-pusher/go.sum

      - name: Build simdevice
        run: |
          set -euo pipefail
          make -C apps/data-pusher build
          test -x apps/data-pusher/dist/simdevice

      # Same identity as the publish (owner decision): no new identity. Its
      # client id is in functions_auth_allowed_client_app_ids in dev.tfvars, so
      # Easy Auth accepts its app-only token.
      - name: Azure login (OIDC — dev app-publish identity)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned, never latest. Gives `az iot hub device-identity`.
      - name: Install the azure-iot CLI extension
        run: az extension add --name azure-iot --version 1.0.0 --yes

      # The standing simulated device (HAR-39). `--auth-type login` makes az use
      # this identity's Entra role (IoT Hub Registry Contributor, HAR-42), not
      # hub keys it cannot list. --hub-name gets the hub's HOSTNAME: with a
      # hostname, azure-iot goes straight to the hub's data plane; with a bare
      # name it first looks the hub up through ARM, which that data-plane-only
      # role cannot read. Only "device not found" (ResourceNotFoundError, az
      # exit 3) leads to a create; any other error (not authorised, hub
      # unreachable) fails the step. stdout is discarded: device JSON carries
      # the device's symmetric keys.
      # HAR-84: a second standing device, <simulated_device_id>-chart, for the
      # cook-chart RU proof (HAR-71), which keeps one active cook on it across
      # runs; on the first device that cook would 409 the device-twin proof's
      # POST /cooks. Same logic, same role; its id is derived here, not in
      # Terraform.
      - name: Ensure the simulated device exists
        env:
          HUB: ${{ needs.deploy.outputs.iot_hub_hostname }}
          DEVICE: ${{ needs.deploy.outputs.simulated_device_id }}
        run: |
          set -euo pipefail
          ensure_device() {
            local id="$1" err="$RUNNER_TEMP/device-show.err" rc=0
            az iot hub device-identity show --hub-name "$HUB" --device-id "$id" \
              --auth-type login -o none >/dev/null 2>"$err" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "device $id: exists"
            elif [ "$rc" -eq 3 ] || grep -q 'DeviceNotFound' "$err"; then
              az iot hub device-identity create --hub-name "$HUB" --device-id "$id" \
                --auth-type login -o none >/dev/null
              echo "device $id: created"
            else
              echo "az iot hub device-identity show for device $id failed (exit $rc), and not because the device is missing:" >&2
              cat "$err" >&2
              exit 1
            fi
          }
          ensure_device "$DEVICE"
          ensure_device "${DEVICE}-chart"

      # The two bearer tokens (app-publish, and the acceptance peer's) and the
      # two standing devices' connection strings (the simulated device's and,
      # HAR-84, the chart device's) are each fetched, masked and used inside
      # this one step, so none ever reaches $GITHUB_ENV, a step output, or
      # another step's process.
      # For each device, both the full connection string and its
      # SharedAccessKey value are masked before the suite starts. The sed
      # pattern spells the field name with a [K] class so this script, which
      # GitHub echoes into the log, never carries the literal field-and-equals
      # text the HAR-44 log check greps for (a match there would hide a real
      # leak). The masks go to stderr, which the runner reads workflow
      # commands from as well, so the function's stdout is only the string.
      - name: Run the live acceptance suite
        env:
          ACCEPTANCE_BASE_URL: https://${{ needs.deploy.outputs.hostname }}/api
          AUDIENCE: ${{ needs.deploy.outputs.audience }}
          HUB: ${{ needs.deploy.outputs.iot_hub_hostname }}
          DEVICE: ${{ needs.deploy.outputs.simulated_device_id }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          APP_DEPLOY_CLIENT_ID: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          PEER_CLIENT_ID: ${{ vars.AZURE_ACCEPTANCE_PEER_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Prints the device's connection string, after masking it and its
          # key. Run as VAR="$(device_connection_string id)": `exit` leaves only
          # the subshell, so the caller's `set -e` fails the step.
          device_connection_string() {
            local id="$1" conn key
            conn="$(az iot hub device-identity connection-string show \
              --hub-name "$HUB" --device-id "$id" --auth-type login \
              --query connectionString -o tsv)" || {
              echo "az iot hub device-identity connection-string show failed for device $id." >&2
              exit 1
            }
            if [ -z "$conn" ]; then
              echo "az returned no connection string for device $id." >&2
              exit 1
            fi
            echo "::add-mask::${conn}" >&2
            key="$(printf '%s' "$conn" | tr ';' '\n' | sed -n 's/^SharedAccess[K]ey=//p')"
            if [ -z "$key" ]; then
              echo "The connection string for device $id has no SharedAccessKey." >&2
              exit 1
            fi
            echo "::add-mask::${key}" >&2
            printf '%s' "$conn"
          }
          SIMDEVICE_CONNECTION_STRING="$(device_connection_string "$DEVICE")"
          export SIMDEVICE_CONNECTION_STRING
          export ACCEPTANCE_SIM_DEVICE_ID="$DEVICE"
          # HAR-84: the chart device, ensured by the step above.
          SIMDEVICE_CHART_CONNECTION_STRING="$(device_connection_string "${DEVICE}-chart")"
          export SIMDEVICE_CHART_CONNECTION_STRING
          export ACCEPTANCE_CHART_DEVICE_ID="${DEVICE}-chart"
          export ACCEPTANCE_SIMDEVICE_BIN="$GITHUB_WORKSPACE/apps/data-pusher/dist/simdevice"
          ACCEPTANCE_BEARER_TOKEN="$(az account get-access-token --scope "${AUDIENCE}/.default" --query accessToken -o tsv)"
          echo "::add-mask::${ACCEPTANCE_BEARER_TOKEN}"
          if [ -z "$ACCEPTANCE_BEARER_TOKEN" ]; then
            echo "az account get-access-token returned no token for ${AUDIENCE}/.default." >&2
            exit 1
          fi
          export ACCEPTANCE_BEARER_TOKEN

          # HAR-65: a second caller's token, for the HAR-55 cross-user proof.
          # The acceptance peer holds no Azure roles and federates the same
          # development subject as app-publish (HAR-61). It signs in from its
          # own throwaway AZURE_CONFIG_DIR, so the app-publish login above is
          # never touched. The JWT payload is decoded only to compare its
          # appid/azp claim; no claim value is printed.
          # HAR-118: telemetry is off for the peer's az calls. With it on,
          # each az command forks a detached uploader that keeps writing
          # under $PEER_AZ/telemetry/ after az returns, and the rm -rf below
          # raced it ("Directory not empty", run 44960958060).
          echo "acceptance peer token: minting"
          if [ -z "$PEER_CLIENT_ID" ]; then
            echo "vars.AZURE_ACCEPTANCE_PEER_CLIENT_ID is empty on the development environment (bootstrap sets it, HAR-61)." >&2
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "No GitHub OIDC request endpoint: the job needs id-token: write." >&2
            exit 1
          fi
          PEER_OIDC="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value // empty')" || {
            echo "Requesting a GitHub OIDC token for the acceptance peer failed." >&2
            exit 1
          }
          if [ -z "$PEER_OIDC" ]; then
            echo "GitHub returned no OIDC token for the acceptance peer." >&2
            exit 1
          fi
          echo "::add-mask::${PEER_OIDC}"
          PEER_AZ="$(mktemp -d)"
          trap 'rm -rf "$PEER_AZ"' EXIT
          AZURE_CORE_COLLECT_TELEMETRY=no AZURE_CONFIG_DIR="$PEER_AZ" az login --service-principal \
            -u "$PEER_CLIENT_ID" --tenant "$TENANT_ID" \
            --federated-token "$PEER_OIDC" --allow-no-subscriptions -o none || {
            echo "az login as the acceptance peer ($PEER_CLIENT_ID) failed." >&2
            exit 1
          }
          ACCEPTANCE_PEER_BEARER_TOKEN="$(AZURE_CORE_COLLECT_TELEMETRY=no AZURE_CONFIG_DIR="$PEER_AZ" az account get-access-token \
            --scope "${AUDIENCE}/.default" --query accessToken -o tsv)" || {
            echo "az account get-access-token as the acceptance peer failed for ${AUDIENCE}/.default." >&2
            exit 1
          }
          unset PEER_OIDC
          rm -rf "$PEER_AZ"
          if [ -z "$ACCEPTANCE_PEER_BEARER_TOKEN" ]; then
            echo "az account get-access-token returned no acceptance peer token for ${AUDIENCE}/.default." >&2
            exit 1
          fi
          echo "::add-mask::${ACCEPTANCE_PEER_BEARER_TOKEN}"
          PEER_PAYLOAD="$(printf '%s' "$ACCEPTANCE_PEER_BEARER_TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#PEER_PAYLOAD} % 4 )) -ne 0 ]; do PEER_PAYLOAD="${PEER_PAYLOAD}="; done
          PEER_APPID="$(printf '%s' "$PEER_PAYLOAD" | base64 -d 2>/dev/null | jq -r '.appid // .azp // empty' 2>/dev/null)" || PEER_APPID=""
          unset PEER_PAYLOAD
          if [ -z "$PEER_APPID" ]; then
            echo "The acceptance peer token has no readable appid/azp claim." >&2
            exit 1
          fi
          if [ "$PEER_APPID" = "$APP_DEPLOY_CLIENT_ID" ]; then
            echo "The acceptance peer token was issued to the app-publish identity: the logins are cross-wired." >&2
            exit 1
          fi
          if [ "$PEER_APPID" != "$PEER_CLIENT_ID" ]; then
            echo "The acceptance peer token was issued to a client other than AZURE_ACCEPTANCE_PEER_CLIENT_ID." >&2
            exit 1
          fi
          unset PEER_APPID
          echo "acceptance peer token: minted; appid check passed (issued to the peer, not app-publish)"
          export ACCEPTANCE_PEER_BEARER_TOKEN

          npx nx run api:acceptance 2>&1 | tee "$RUNNER_TEMP/acceptance.log"

      # Proof results, METRIC lines and the RU-per-route table, also in the
      # run summary.
      - name: Write the acceptance summary
        if: always()
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/acceptance.log"
          {
            echo "## Live acceptance — dev"
            echo
            echo "Commit \`$SHA\`"
            echo
            if [ -s "$LOG" ]; then
              echo '```'
              # Proof lines, METRIC lines (e.g. `METRIC roundtrip-ms 2140`),
              # then the RU table through the totals line. Strip
              # terminal colour codes so the summary renders cleanly.
              sed -E 's/\x1b\[[0-9;]*m//g' "$LOG" | awk '
                /^acceptance run / || /^(PASS|FAIL|SKIP) / || /^METRIC / { print; next }
                /^RU per route$/ { table = 1 }
                table { print }
                /^acceptance: / { table = 0 }
              '
              echo '```'
            else
              echo "The suite produced no output; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # HAR-101 (goal HAR-71): the live browser proof (HAR-99). On the PRODUCTION
  # web app, which Vercel builds from main on its own, the acceptance user
  # signs in through Microsoft's real pages with a TOTP code, starts a cook on
  # the web device, sees a reading simdevice pushes, and stops the cook. In
  # parallel with `acceptance`: it sends as its own device, and its first step
  # waits up to 15 min for Vercel to serve this commit anyway.
  web-acceptance:
    needs: deploy
    # Skipped when the deploy job published nothing, as `acceptance` is.
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    steps:
      # Full history: the proof's build check asks `git merge-base
      # --is-ancestor` whether the commit production serves contains this one.
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # When production already serves a main commit newer than this checkout,
      # the proof runs `git fetch origin <sha> <sha>` (isAncestorCommit in
      # apps/web-e2e/live/helpers.ts). The checkout keeps no token, so prove
      # here, before the proof's 15 min wait, that origin answers a fetch
      # without one (the repository is public), and that the commit the proof
      # will wait for is a full 40-character sha.
      - name: Check origin answers a fetch without a token
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "needs.deploy.outputs.sha is not a full 40-character commit sha: '$SHA'." >&2
            exit 1
          }
          git config --get-regexp '^http\..*extraheader' >/dev/null && {
            echo "The checkout left an auth header in git config; expected none (persist-credentials: false)." >&2
            exit 1
          }
          git fetch --quiet --no-tags origin main || {
            echo "git fetch from origin failed without a token; the proof's ancestor check would fail the same way." >&2
            exit 1
          }
          echo "origin fetch without a token: ok (main is $(git rev-parse FETCH_HEAD))"
          if git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "ancestor check: $SHA is on main"
          else
            echo "ancestor check: $SHA is not on main's tip; the proof will fail unless production serves it exactly" >&2
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      # simdevice (HAR-40) sends the reading the browser must show.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/data-pusher/go.mod
          cache-dependency-path: apps/data-pusher/go.sum

      - name: Build simdevice
        run: |
          set -euo pipefail
          make -C apps/data-pusher build
          test -x apps/data-pusher/dist/simdevice

      # As ci.yml's web-e2e job (HAR-98): the browser build is tied to the
      # exact @playwright/test version, read from the lockfile, so that is the
      # cache key.
      - name: Resolve the installed @playwright/test version
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # Runs on a cache hit too: the cache holds the browser only, not the apt
      # packages Chromium links against.
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      # Only to manage the web device in IoT Hub: the proof calls the API as
      # the acceptance user, through the browser, not as this identity.
      - name: Azure login (OIDC — dev app-publish identity)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned, never latest. Gives `az iot hub device-identity`.
      - name: Install the azure-iot CLI extension
        run: az extension add --name azure-iot --version 1.0.0 --yes

      # The third standing device, <simulated_device_id>-web, the proof's own:
      # the same show / create-on-not-found logic, flags and reasons as the
      # `acceptance` job's step for its two devices. The proof registers it
      # with the API as the acceptance user; this only makes it exist in the
      # hub. stdout is discarded: device JSON carries the device's keys.
      - name: Ensure the web device exists
        env:
          HUB: ${{ needs.deploy.outputs.iot_hub_hostname }}
          DEVICE: ${{ needs.deploy.outputs.simulated_device_id }}-web
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/web-device-show.err" rc=0
          az iot hub device-identity show --hub-name "$HUB" --device-id "$DEVICE" \
            --auth-type login -o none >/dev/null 2>"$err" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "device $DEVICE: exists"
          elif [ "$rc" -eq 3 ] || grep -q 'DeviceNotFound' "$err"; then
            az iot hub device-identity create --hub-name "$HUB" --device-id "$DEVICE" \
              --auth-type login -o none >/dev/null
            echo "device $DEVICE: created"
          else
            echo "az iot hub device-identity show for device $DEVICE failed (exit $rc), and not because the device is missing:" >&2
            cat "$err" >&2
            exit 1
          fi

      # The web device's connection string is fetched, masked (whole, and its
      # SharedAccessKey value) and exported inside this one step, as the
      # `acceptance` job does, so it never reaches $GITHUB_ENV, a step output
      # or another step. The sed pattern spells the field with a [K] class so
      # this script, which GitHub echoes into the log, never carries the
      # literal field-and-equals text the leak check below greps for. The
      # password and TOTP secret are repository secrets, which GitHub masks.
      - name: Run the live browser proof
        env:
          HUB: ${{ needs.deploy.outputs.iot_hub_hostname }}
          WEB_BASE_URL: https://meatgeekv2-web.vercel.app
          EXPECTED_WEB_SHA: ${{ needs.deploy.outputs.sha }}
          ACCEPTANCE_USER_UPN: ${{ vars.ACCEPTANCE_USER_UPN }}
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_TOTP_SECRET: ${{ secrets.ACCEPTANCE_USER_TOTP_SECRET }}
          ACCEPTANCE_WEB_DEVICE_ID: ${{ needs.deploy.outputs.simulated_device_id }}-web
        run: |
          set -euo pipefail
          conn="$(az iot hub device-identity connection-string show \
            --hub-name "$HUB" --device-id "$ACCEPTANCE_WEB_DEVICE_ID" --auth-type login \
            --query connectionString -o tsv)" || {
            echo "az iot hub device-identity connection-string show failed for device $ACCEPTANCE_WEB_DEVICE_ID." >&2
            exit 1
          }
          if [ -z "$conn" ]; then
            echo "az returned no connection string for device $ACCEPTANCE_WEB_DEVICE_ID." >&2
            exit 1
          fi
          echo "::add-mask::${conn}"
          key="$(printf '%s' "$conn" | tr ';' '\n' | sed -n 's/^SharedAccess[K]ey=//p')"
          if [ -z "$key" ]; then
            echo "The connection string for device $ACCEPTANCE_WEB_DEVICE_ID has no SharedAccessKey." >&2
            exit 1
          fi
          echo "::add-mask::${key}"
          unset key
          SIMDEVICE_WEB_CONNECTION_STRING="$conn"
          unset conn
          export SIMDEVICE_WEB_CONNECTION_STRING
          export ACCEPTANCE_SIMDEVICE_BIN="$GITHUB_WORKSPACE/apps/data-pusher/dist/simdevice"

          npx nx e2e-live web-e2e 2>&1 | tee "$RUNNER_TEMP/web-acceptance.log"

      # Proof step results, the two METRIC lines and Playwright's summary line,
      # also in the run summary.
      - name: Write the web acceptance summary
        if: always()
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/web-acceptance.log"
          {
            echo "## Live browser proof — production web app"
            echo
            echo "Commit \`$SHA\`, https://meatgeekv2-web.vercel.app"
            echo
            if [ -s "$LOG" ]; then
              echo '```'
              # PASS/FAIL/SKIP lines (live/step-reporter.ts), METRIC lines
              # (e.g. `METRIC web-push-ms 1840`), and Playwright's own
              # "1 passed (3.1m)" style summary. Colour codes stripped.
              sed -E 's/\x1b\[[0-9;]*m//g' "$LOG" | grep -E \
                '^(PASS|FAIL|SKIP) |^METRIC |^ *[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' || true
              echo '```'
            else
              echo "The proof produced no output; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The HAR-44-style leak check (.github/scripts/web-acceptance-leak-check.cjs),
      # over this job's raw proof output (the file tee wrote, before GitHub's
      # masking, so a masked secret is still caught) and every sign-in
      # diagnostic the proof wrote (HAR-121): no connection-string key field,
      # no password, no TOTP secret, and no TOTP code from any 30 s window the
      # job can have run in (the 30 min timeout, plus a margin). Line numbers
      # only; nothing found is printed. HAR-126: it runs BEFORE the upload
      # below and deletes every diagnostic with a finding, so the upload
      # cannot include one. Exit 0 is clean, 1 is a finding (handled), 2 is a
      # check that could not finish or delete; `checked` is set only on 0 or
      # 1, and the upload needs it.
      - name: Check the proof's output and sign-in diagnostics for leaked secrets
        id: leak-check
        if: always()
        env:
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_TOTP_SECRET: ${{ secrets.ACCEPTANCE_USER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          rc=0
          node .github/scripts/web-acceptance-leak-check.cjs \
            "$RUNNER_TEMP/web-acceptance.log" \
            'dist/.playwright/web-e2e-live/test-results/**/sign-in-diagnostic.txt' || rc=$?
          if [ "$rc" -le 1 ]; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # On failure: the proof's own failure screenshot, taken only after
      # sign-in (the sign-in pages show the UPN and what was typed), and the
      # sign-in diagnostic, which names which of Microsoft's selectors were on
      # the page and holds no typed value, cookie or query string. Trace,
      # video and Playwright's failure screenshot and page snapshot are off
      # (playwright.live.config.ts); the globs keep this to those two even
      # so. Only after the leak check above finished: a diagnostic it found
      # anything in is already deleted, and if it could not finish nothing is
      # uploaded.
      - name: Upload the proof's failure screenshots and sign-in diagnostics
        if: failure() && steps.leak-check.outputs.checked == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-acceptance-diagnostics
          path: |
            dist/.playwright/web-e2e-live/test-results/**/*.png
            dist/.playwright/web-e2e-live/test-results/**/sign-in-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 7
