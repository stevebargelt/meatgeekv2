name: Deploy Dev App

# MG-36 / HAR-13 — deploy every green main commit to the DEV Function App, then
# prove the deployed API works with the live acceptance suite.
#
#   CI/CD Pipeline (push to main, green)
#     -> Apply Dev Infrastructure (workflow_run; applies the same commit)
#       -> Deploy Dev App (this file; workflow_run)
#            deploy      publish the API to the dev Function App
#            acceptance  `nx run api:acceptance` against it, as the same identity
#            web-acceptance  (HAR-101, in parallel with acceptance) the live
#                        browser proof, `nx e2e-live web-e2e`: the PRODUCTION web
#                        app (Vercel builds main on its own), signed in as the
#                        TOTP acceptance user, sees a reading pushed by
#                        simdevice as <simulated_device_id>-web. The app-publish
#                        login only manages that device in IoT Hub.
#            ios-acceptance  (HAR-169, after web-acceptance, never alongside it:
#                        both sign in as the acceptance user with TOTP) the live
#                        iOS proof, apps/ios/scripts/run-live-proof.sh on macOS:
#                        the real iOS app in a simulator, signed in as the
#                        acceptance user, sees a reading pushed by simdevice as
#                        <simulated_device_id>-ios.
#
# Chaining after the infra apply, not after CI, means the infrastructure for a
# commit (including the Easy Auth caller list the acceptance job depends on) is
# applied before the API for that commit is published and tested.
#
# CREDENTIALS NEVER MEET UNMERGED CODE. The only triggers are workflow_run and
# workflow_dispatch (main only). `workflow_run` always executes the workflow file
# from the default branch, and every job checks out a commit that is on main and
# has a green CI/CD Pipeline push run (verified below, on every trigger).
#
# Docs: docs/development/ci-cd.md (Dev app deploy) and
#       docs/development/live-acceptance.md (the suite and the browser proof).
on:
  workflow_run:
    workflows: ['Apply Dev Infrastructure']
    types: [completed]
  # Manual re-run of the current main tip. The deploy job refuses any ref other
  # than main and any commit without a successful CI/CD Pipeline push run.
  workflow_dispatch:

# id-token: write  — azure/login and terraform mint an OIDC token for the dev
#                    app-publish identity (development environment, in every
#                    job); the acceptance suite step mints one more for
#                    the zero-role acceptance peer identity (HAR-61/HAR-65).
# contents: read   — checkout and the main-tip lookups.
# actions: read    — look up the commit's CI/CD Pipeline runs.
permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_VERSION: '24'
  # Let corepack download the packageManager-pinned npm without an interactive prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Same Core Tools pin as app-deploy-prod.yml.
  FUNC_CORE_TOOLS_VERSION: '4.12.1'

# One dev deploy at a time; never cancel a publish half way. GitHub keeps only
# the newest pending run in the group, which is the one worth deploying.
concurrency:
  group: app-deploy-dev-development
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    outputs:
      deployed: ${{ steps.publish.outputs.deployed }}
      sha: ${{ steps.target.outputs.sha }}
      hostname: ${{ steps.tfout.outputs.function_app_hostname }}
      audience: ${{ steps.tfout.outputs.functions_auth_audience }}
      iot_hub_name: ${{ steps.tfout.outputs.iot_hub_name }}
      iot_hub_hostname: ${{ steps.tfout.outputs.iot_hub_hostname }}
      simulated_device_id: ${{ steps.tfout.outputs.simulated_device_id }}
      dps_name: ${{ steps.tfout.outputs.dps_name }}
      dps_id_scope: ${{ steps.tfout.outputs.dps_id_scope }}
    env:
      # Terraform reads dev state as the app-publish identity over OIDC. Without
      # ARM_USE_OIDC the azurerm backend falls back to the az CLI session, which
      # it refuses for a service principal. bootstrap.sh grants this identity
      # Storage Blob Data Reader on the tfstate-dev container for this read.
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
      ARM_USE_OIDC: 'true'
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
    steps:
      # Which commit this run deploys. workflow_run: the commit the infra apply
      # ran for. workflow_dispatch: the dispatched ref, which must be main.
      - name: Resolve the target commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
              echo "Refusing: workflow_dispatch is allowed from main only (got $DISPATCH_REF)." >&2
              exit 1
            fi
            SHA="$DISPATCH_SHA"
          else
            SHA="$RUN_SHA"
          fi
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "Could not resolve the commit to deploy — refusing." >&2
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target commit: $SHA"

      # The commit must have a successful CI/CD Pipeline run for a push to main.
      # This is checked on BOTH triggers: an `Apply Dev Infrastructure` run that
      # skipped as superseded reports main's tip as its head_sha, and that tip's
      # own CI may have failed or still be running. Dispatch refuses (red);
      # workflow_run skips (green, nothing deployed) because that commit's own
      # CI result is what decides whether it ships.
      - name: Require a green CI/CD Pipeline push run for the commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&branch=main&status=success" --jq .total_count)"
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "CI/CD Pipeline succeeded for $SHA on a push to main."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Refusing: $SHA has no successful CI/CD Pipeline push run on main." >&2
            exit 1
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
            echo "$SHA has no successful CI/CD Pipeline push run on main — skipping deploy (not a failure)."
          fi

      # Stale-SHA guard, as in app-deploy-prod.yml: deploy only main's tip.
      - name: Stale-SHA guard (deploy only the current main tip)
        id: freshness
        if: steps.ci.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_TIP="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "Target commit: $SHA"
          echo "Current main:  $CURRENT_TIP"
          if [ "$SHA" = "$CURRENT_TIP" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Target is the current main tip — proceeding."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "main has advanced past the target — skipping deploy (not a failure)."
          fi

      - name: Checkout the target commit
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        if: steps.freshness.outputs.fresh == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.freshness.outputs.fresh == 'true'
        run: npm ci

      - name: Build api
        if: steps.freshness.outputs.fresh == 'true'
        run: npx nx build api

      - name: Verify Functions package
        if: steps.freshness.outputs.fresh == 'true'
        run: node apps/api/tools/verify-func-package.js dist/apps/api

      # Flex Consumption runs the package as uploaded (--no-build), so its
      # runtime dependencies must be in it.
      - name: Install the package's runtime dependencies
        if: steps.freshness.outputs.fresh == 'true'
        working-directory: dist/apps/api
        run: npm install --omit=dev --ignore-scripts

      - name: Pin Azure Functions Core Tools
        if: steps.freshness.outputs.fresh == 'true'
        run: npm i -g "azure-functions-core-tools@${FUNC_CORE_TOOLS_VERSION}"

      - name: Setup Terraform
        if: steps.freshness.outputs.fresh == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '~1.9'
          terraform_wrapper: false

      # The dev APP-PUBLISH identity: Website Contributor on the dev Function App
      # plus the Flex deployment-package container role, and read-only on dev
      # state. Not the infra-apply identity.
      - name: Azure login (OIDC — dev app-publish identity)
        if: steps.freshness.outputs.fresh == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Never hard-code the Function App or the hub: read the app's name, host,
      # the API audience, the IoT Hub name and hostname, the standing
      # simulated device id, and (HAR-139) the DPS name and ID scope the
      # simulated devices enrol and register with, from the dev Terraform state.
      - name: Resolve Function App, API audience, IoT Hub, DPS and simulated device (Terraform outputs)
        id: tfout
        if: steps.freshness.outputs.fresh == 'true'
        working-directory: apps/infrastructure
        run: |
          set -euo pipefail
          STATE_ACCOUNT="$(scripts/state-account-name.sh "$ARM_SUBSCRIPTION_ID")"
          terraform init -input=false -reconfigure -lockfile=readonly \
            -backend-config=environments/backend-dev.hcl \
            -backend-config="storage_account_name=$STATE_ACCOUNT"
          for OUT in function_app_name function_app_hostname functions_auth_audience iot_hub_name iot_hub_hostname simulated_device_id dps_name dps_id_scope; do
            VALUE="$(terraform output -raw "$OUT")"
            if [ -z "$VALUE" ]; then
              echo "Terraform output $OUT is empty — aborting deploy." >&2
              exit 1
            fi
            echo "$OUT=$VALUE" >> "$GITHUB_OUTPUT"
            echo "$OUT: $VALUE"
          done

      # Authoritative freshness gate, right before publish: main can advance
      # during the build.
      - name: Re-verify main tip (final freshness gate before publish)
        id: freshness_final
        if: steps.freshness.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_TIP="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "Target commit: $SHA"
          echo "Current main:  $CURRENT_TIP"
          if [ "$SHA" = "$CURRENT_TIP" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Still the current main tip — publishing."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "main advanced during the build — skipping publish (not a failure)."
          fi

      # The publish method proven by hand in MG-21. `nx deploy api` does not work
      # on Flex Consumption. `--javascript` is required because Core Tools reads
      # the legacy FUNCTIONS_WORKER_RUNTIME setting, which Flex correctly lacks.
      - name: Publish to the dev Function App
        id: publish
        if: steps.freshness.outputs.fresh == 'true' && steps.freshness_final.outputs.fresh == 'true'
        working-directory: dist/apps/api
        env:
          FUNCTION_APP_NAME: ${{ steps.tfout.outputs.function_app_name }}
        run: |
          set -euo pipefail
          func azure functionapp publish "$FUNCTION_APP_NAME" --javascript --no-build
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: deploy
    # Skipped when the deploy job published nothing (stale or not CI-green).
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    # 40, not 15: a later HAR-39 proof sends up to 8,640 readings in one run.
    timeout-minutes: 40
    environment: development
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      # simdevice (HAR-40) sends readings to IoT Hub as the simulated device.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/data-pusher/go.mod
          # No cache of its own. The runner makes this workflow's cache
          # read-only (ACTIONS_CACHE_MODE=read), so setup-go never saved one
          # and every job downloaded every module from proxy.golang.org on
          # every deploy; one proxy stream error failed run 45465463113
          # (HAR-170). The modules come from CI's cache, restored next.
          cache: false

      # The Go cache ci.yml's build-go job saves on main for this commit's
      # go.sum files (it built and tested data-pusher, simdevice included,
      # before this run could start). Same key and paths as there, so the same
      # cache version; the version has no OS in it, so ios-acceptance on macOS
      # restores it too. Keep both in step with ci.yml's "Cache Go modules".
      - name: Restore the Go module cache from CI
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: Linux-go-${{ hashFiles('**/go.sum') }}

      # With CI's cache, no network: GOPROXY=off. Without it (CI's cache for
      # this go.sum evicted or not saved), a warning and the old download.
      - name: Build simdevice
        env:
          GO_CACHE_HIT: ${{ steps.gocache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$GO_CACHE_HIT" = "true" ]; then
            export GOPROXY=off
          else
            echo "::warning title=simdevice::No Go module cache from ci.yml's build-go for this go.sum: downloading every module from proxy.golang.org."
          fi
          make -C apps/data-pusher build
          test -x apps/data-pusher/dist/simdevice

      # Same identity as the publish (owner decision): no new identity. Its
      # client id is in functions_auth_allowed_client_app_ids in dev.tfvars, so
      # Easy Auth accepts its app-only token.
      - name: Azure login (OIDC — dev app-publish identity)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned, never latest. Gives `az iot hub device-identity` and
      # `az iot dps enrollment`, which enrol-device.sh calls.
      - name: Install the azure-iot CLI extension
        run: az extension add --name azure-iot --version 1.0.0 --yes

      # HAR-139: each simulated device gets its identity the way the owner's Pi
      # does. The standing simulated device (HAR-39) and, HAR-84, the chart
      # device <simulated_device_id>-chart, for the cook-chart RU proof
      # (HAR-71), which keeps one active cook on it across runs.
      #
      # 1. Migration, once: a hub identity left from the SAS era is deleted so
      #    DPS creates an X.509 one when the device registers. One with any
      #    other authentication type, or none at all, is left alone. Only
      #    `--query authentication.type` is read, so no key is printed. Only
      #    "device not found" (ResourceNotFoundError, az exit 3) counts as no
      #    identity; any other error fails the step.
      # 2. The device makes its own key in a fresh state dir under
      #    $RUNNER_TEMP (`simdevice identity init`, which prints only the
      #    certificate), so every run has a new key and, from the second run
      #    on, enrol-device.sh replaces the enrollment's certificate: the
      #    re-imaged-Pi path. The key goes with the runner.
      # 3. enrol-device.sh enrols that certificate in DPS and prints its one
      #    result line. Any non-zero exit fails the step.
      # 4. The device registers with DPS (`simdevice --twin --count 0`), so
      #    its hub identity exists before the suite writes its twin.
      #
      # `--auth-type login` makes az use this identity's Entra roles (IoT Hub
      # Registry Contributor, HAR-42; Device Provisioning Service Data
      # Contributor, HAR-137), not keys it cannot list. Both are data-plane
      # roles, with no ARM read, so the hub and the DPS are named by HOST
      # NAME: azure-iot then goes straight to the data plane, and
      # enrol-device.sh makes no ARM call (its host-name mode).
      - name: Enrol the simulated devices through DPS
        env:
          HUB: ${{ needs.deploy.outputs.iot_hub_hostname }}
          DPS_HOST: ${{ needs.deploy.outputs.dps_name }}.azure-devices-provisioning.net
          DEVICE: ${{ needs.deploy.outputs.simulated_device_id }}
          MEATGEEK_DPS_ID_SCOPE: ${{ needs.deploy.outputs.dps_id_scope }}
        run: |
          set -euo pipefail
          migrate_sas_identity() {
            local id="$1" err="$RUNNER_TEMP/device-auth.err" rc=0 auth
            auth="$(az iot hub device-identity show --hub-name "$HUB" --device-id "$id" \
              --auth-type login --query authentication.type -o tsv 2>"$err")" || rc=$?
            if [ "$rc" -eq 0 ] && [ "$auth" = "sas" ]; then
              az iot hub device-identity delete --hub-name "$HUB" --device-id "$id" \
                --auth-type login -o none >/dev/null
              echo "migrated $id"
            elif [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || grep -q 'DeviceNotFound' "$err"; then
              echo "ok $id"
            else
              echo "az iot hub device-identity show for device $id failed (exit $rc), and not because the device is missing:" >&2
              cat "$err" >&2
              exit 1
            fi
          }
          enrol() {
            local id="$1" dir="$RUNNER_TEMP/devices/$1"
            mkdir -p "$RUNNER_TEMP/devices"
            apps/data-pusher/dist/simdevice identity init --device-id "$id" \
              --state-dir "$dir" > "$dir.pem"
            apps/data-pusher/deploy/enrol-device.sh --device-id "$id" \
              --certificate "$dir.pem" --auth-type login \
              --dps "$DPS_HOST" --hub "$HUB"
          }
          # Register with DPS now, so the device's hub identity exists before
          # the suite writes its twin. Without this, the first POST /cooks
          # after a migration (or for a new device id) wrote
          # desired.activeCookId to a device the hub did not have, and the
          # device's first registration then made a fresh identity with an
          # empty twin (run 45080482155). --twin --count 0 registers, reads
          # and reports the twin, and sends no reading.
          register() {
            local id="$1" dir="$RUNNER_TEMP/devices/$1" log="$RUNNER_TEMP/devices/$1.register.log"
            if MEATGEEK_DEVICE_ID="$id" MEATGEEK_STATE_DIR="$dir" \
              apps/data-pusher/dist/simdevice --twin --count 0 --timeout 2m >/dev/null 2>"$log"; then
              echo "registered $id"
            else
              echo "simdevice could not register device $id with DPS:" >&2
              cat "$log" >&2
              exit 1
            fi
          }
          for id in "$DEVICE" "${DEVICE}-chart"; do
            migrate_sas_identity "$id"
            enrol "$id"
            register "$id"
          done

      # The two bearer tokens (app-publish, and the acceptance peer's) are
      # each fetched, masked and used inside this one step, so neither ever
      # reaches $GITHUB_ENV, a step output, or another step's process.
      # HAR-139: the devices hold no credential the runner hands over. Each
      # simdevice run is in DPS mode, with the state dir the step above made
      # (its own key and certificate) and the DPS ID scope, which is not a
      # secret.
      - name: Run the live acceptance suite
        env:
          ACCEPTANCE_BASE_URL: https://${{ needs.deploy.outputs.hostname }}/api
          AUDIENCE: ${{ needs.deploy.outputs.audience }}
          DEVICE: ${{ needs.deploy.outputs.simulated_device_id }}
          ACCEPTANCE_DPS_ID_SCOPE: ${{ needs.deploy.outputs.dps_id_scope }}
          # HAR-140: enrol-device.sh and delete-device.sh for the fresh
          # acceptance-* devices. This identity has data-plane roles only (no
          # ARM read), so the scripts name the DPS and the hub by host.
          ACCEPTANCE_IOT_HUB_HOST: ${{ needs.deploy.outputs.iot_hub_hostname }}
          ACCEPTANCE_DPS_HOST: ${{ needs.deploy.outputs.dps_name }}.azure-devices-provisioning.net
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          APP_DEPLOY_CLIENT_ID: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          PEER_CLIENT_ID: ${{ vars.AZURE_ACCEPTANCE_PEER_CLIENT_ID }}
        run: |
          set -euo pipefail
          export ACCEPTANCE_SIM_DEVICE_ID="$DEVICE"
          export ACCEPTANCE_SIM_STATE_DIR="$RUNNER_TEMP/devices/$DEVICE"
          # HAR-84: the chart device, enrolled by the step above.
          export ACCEPTANCE_CHART_DEVICE_ID="${DEVICE}-chart"
          export ACCEPTANCE_CHART_STATE_DIR="$RUNNER_TEMP/devices/${DEVICE}-chart"
          export ACCEPTANCE_SIMDEVICE_BIN="$GITHUB_WORKSPACE/apps/data-pusher/dist/simdevice"
          ACCEPTANCE_BEARER_TOKEN="$(az account get-access-token --scope "${AUDIENCE}/.default" --query accessToken -o tsv)"
          echo "::add-mask::${ACCEPTANCE_BEARER_TOKEN}"
          if [ -z "$ACCEPTANCE_BEARER_TOKEN" ]; then
            echo "az account get-access-token returned no token for ${AUDIENCE}/.default." >&2
            exit 1
          fi
          export ACCEPTANCE_BEARER_TOKEN

          # HAR-65: a second caller's token, for the HAR-55 cross-user proof.
          # The acceptance peer holds no Azure roles and federates the same
          # development subject as app-publish (HAR-61). It signs in from its
          # own throwaway AZURE_CONFIG_DIR, so the app-publish login above is
          # never touched. The JWT payload is decoded only to compare its
          # appid/azp claim; no claim value is printed.
          # HAR-118: telemetry is off for the peer's az calls. With it on,
          # each az command forks a detached uploader that keeps writing
          # under $PEER_AZ/telemetry/ after az returns, and the rm -rf below
          # raced it ("Directory not empty", run 44960958060).
          echo "acceptance peer token: minting"
          if [ -z "$PEER_CLIENT_ID" ]; then
            echo "vars.AZURE_ACCEPTANCE_PEER_CLIENT_ID is empty on the development environment (bootstrap sets it, HAR-61)." >&2
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "No GitHub OIDC request endpoint: the job needs id-token: write." >&2
            exit 1
          fi
          PEER_OIDC="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value // empty')" || {
            echo "Requesting a GitHub OIDC token for the acceptance peer failed." >&2
            exit 1
          }
          if [ -z "$PEER_OIDC" ]; then
            echo "GitHub returned no OIDC token for the acceptance peer." >&2
            exit 1
          fi
          echo "::add-mask::${PEER_OIDC}"
          PEER_AZ="$(mktemp -d)"
          trap 'rm -rf "$PEER_AZ"' EXIT
          AZURE_CORE_COLLECT_TELEMETRY=no AZURE_CONFIG_DIR="$PEER_AZ" az login --service-principal \
            -u "$PEER_CLIENT_ID" --tenant "$TENANT_ID" \
            --federated-token "$PEER_OIDC" --allow-no-subscriptions -o none || {
            echo "az login as the acceptance peer ($PEER_CLIENT_ID) failed." >&2
            exit 1
          }
          ACCEPTANCE_PEER_BEARER_TOKEN="$(AZURE_CORE_COLLECT_TELEMETRY=no AZURE_CONFIG_DIR="$PEER_AZ" az account get-access-token \
            --scope "${AUDIENCE}/.default" --query accessToken -o tsv)" || {
            echo "az account get-access-token as the acceptance peer failed for ${AUDIENCE}/.default." >&2
            exit 1
          }
          unset PEER_OIDC
          rm -rf "$PEER_AZ"
          if [ -z "$ACCEPTANCE_PEER_BEARER_TOKEN" ]; then
            echo "az account get-access-token returned no acceptance peer token for ${AUDIENCE}/.default." >&2
            exit 1
          fi
          echo "::add-mask::${ACCEPTANCE_PEER_BEARER_TOKEN}"
          PEER_PAYLOAD="$(printf '%s' "$ACCEPTANCE_PEER_BEARER_TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#PEER_PAYLOAD} % 4 )) -ne 0 ]; do PEER_PAYLOAD="${PEER_PAYLOAD}="; done
          PEER_APPID="$(printf '%s' "$PEER_PAYLOAD" | base64 -d 2>/dev/null | jq -r '.appid // .azp // empty' 2>/dev/null)" || PEER_APPID=""
          unset PEER_PAYLOAD
          if [ -z "$PEER_APPID" ]; then
            echo "The acceptance peer token has no readable appid/azp claim." >&2
            exit 1
          fi
          if [ "$PEER_APPID" = "$APP_DEPLOY_CLIENT_ID" ]; then
            echo "The acceptance peer token was issued to the app-publish identity: the logins are cross-wired." >&2
            exit 1
          fi
          if [ "$PEER_APPID" != "$PEER_CLIENT_ID" ]; then
            echo "The acceptance peer token was issued to a client other than AZURE_ACCEPTANCE_PEER_CLIENT_ID." >&2
            exit 1
          fi
          unset PEER_APPID
          echo "acceptance peer token: minted; appid check passed (issued to the peer, not app-publish)"
          export ACCEPTANCE_PEER_BEARER_TOKEN

          npx nx run api:acceptance 2>&1 | tee "$RUNNER_TEMP/acceptance.log"

      # Proof results, METRIC lines and the RU-per-route table, also in the
      # run summary.
      - name: Write the acceptance summary
        if: always()
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/acceptance.log"
          {
            echo "## Live acceptance — dev"
            echo
            echo "Commit \`$SHA\`"
            echo
            if [ -s "$LOG" ]; then
              echo '```'
              # Proof lines, METRIC lines (e.g. `METRIC roundtrip-ms 2140`),
              # then the RU table through the totals line. Strip
              # terminal colour codes so the summary renders cleanly.
              sed -E 's/\x1b\[[0-9;]*m//g' "$LOG" | awk '
                /^acceptance run / || /^(PASS|FAIL|SKIP) / || /^METRIC / { print; next }
                /^RU per route$/ { table = 1 }
                table { print }
                /^acceptance: / { table = 0 }
              '
              echo '```'
            else
              echo "The suite produced no output; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # HAR-101 (goal HAR-71): the live browser proof (HAR-99). On the PRODUCTION
  # web app, which Vercel builds from main on its own, the acceptance user
  # signs in through Microsoft's real pages with a TOTP code, starts a cook on
  # the web device, sees a reading simdevice pushes, and stops the cook. In
  # parallel with `acceptance`: it sends as its own device, and its first step
  # waits up to 15 min for Vercel to serve this commit anyway.
  web-acceptance:
    needs: deploy
    # Skipped when the deploy job published nothing, as `acceptance` is.
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    steps:
      # Full history: the proof's build check asks `git merge-base
      # --is-ancestor` whether the commit production serves contains this one.
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # When production already serves a main commit newer than this checkout,
      # the proof runs `git fetch origin <sha> <sha>` (isAncestorCommit in
      # apps/web-e2e/live/helpers.ts). The checkout keeps no token, so prove
      # here, before the proof's 15 min wait, that origin answers a fetch
      # without one (the repository is public), and that the commit the proof
      # will wait for is a full 40-character sha.
      - name: Check origin answers a fetch without a token
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "needs.deploy.outputs.sha is not a full 40-character commit sha: '$SHA'." >&2
            exit 1
          }
          git config --get-regexp '^http\..*extraheader' >/dev/null && {
            echo "The checkout left an auth header in git config; expected none (persist-credentials: false)." >&2
            exit 1
          }
          git fetch --quiet --no-tags origin main || {
            echo "git fetch from origin failed without a token; the proof's ancestor check would fail the same way." >&2
            exit 1
          }
          echo "origin fetch without a token: ok (main is $(git rev-parse FETCH_HEAD))"
          if git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "ancestor check: $SHA is on main"
          else
            echo "ancestor check: $SHA is not on main's tip; the proof will fail unless production serves it exactly" >&2
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      # simdevice (HAR-40) sends the reading the browser must show.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/data-pusher/go.mod
          # As the acceptance job: modules from CI's cache, not the proxy.
          cache: false

      - name: Restore the Go module cache from CI
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: Linux-go-${{ hashFiles('**/go.sum') }}

      - name: Build simdevice
        env:
          GO_CACHE_HIT: ${{ steps.gocache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$GO_CACHE_HIT" = "true" ]; then
            export GOPROXY=off
          else
            echo "::warning title=simdevice::No Go module cache from ci.yml's build-go for this go.sum: downloading every module from proxy.golang.org."
          fi
          make -C apps/data-pusher build
          test -x apps/data-pusher/dist/simdevice

      # As ci.yml's web-e2e job (HAR-98): the browser build is tied to the
      # exact @playwright/test version, read from the lockfile, so that is the
      # cache key.
      - name: Resolve the installed @playwright/test version
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      # Runs on a cache hit too: the cache holds the browser only, not the apt
      # packages Chromium links against.
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      # Only to manage the web device in IoT Hub: the proof calls the API as
      # the acceptance user, through the browser, not as this identity.
      - name: Azure login (OIDC — dev app-publish identity)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned, never latest. Gives `az iot hub device-identity` and
      # `az iot dps enrollment`, which enrol-device.sh calls.
      - name: Install the azure-iot CLI extension
        run: az extension add --name azure-iot --version 1.0.0 --yes

      # The third standing device, <simulated_device_id>-web, the proof's own:
      # the same migration, `identity init` and enrol-device.sh, with the same
      # flags and reasons, as the `acceptance` job's step for its two devices
      # (HAR-139). The proof registers it with the API as the acceptance user;
      # this only gives it its identity.
      - name: Enrol the web device through DPS
        env:
          HUB: ${{ needs.deploy.outputs.iot_hub_hostname }}
          DPS_HOST: ${{ needs.deploy.outputs.dps_name }}.azure-devices-provisioning.net
          DEVICE: ${{ needs.deploy.outputs.simulated_device_id }}-web
          MEATGEEK_DPS_ID_SCOPE: ${{ needs.deploy.outputs.dps_id_scope }}
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/web-device-auth.err" rc=0
          auth="$(az iot hub device-identity show --hub-name "$HUB" --device-id "$DEVICE" \
            --auth-type login --query authentication.type -o tsv 2>"$err")" || rc=$?
          if [ "$rc" -eq 0 ] && [ "$auth" = "sas" ]; then
            az iot hub device-identity delete --hub-name "$HUB" --device-id "$DEVICE" \
              --auth-type login -o none >/dev/null
            echo "migrated $DEVICE"
          elif [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || grep -q 'DeviceNotFound' "$err"; then
            echo "ok $DEVICE"
          else
            echo "az iot hub device-identity show for device $DEVICE failed (exit $rc), and not because the device is missing:" >&2
            cat "$err" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/devices/$DEVICE"
          mkdir -p "$RUNNER_TEMP/devices"
          apps/data-pusher/dist/simdevice identity init --device-id "$DEVICE" \
            --state-dir "$dir" > "$dir.pem"
          apps/data-pusher/deploy/enrol-device.sh --device-id "$DEVICE" \
            --certificate "$dir.pem" --auth-type login \
            --dps "$DPS_HOST" --hub "$HUB"
          # Register with DPS now, so the hub identity exists before the proof
          # writes the twin (see the API acceptance job's enrol step).
          if MEATGEEK_DEVICE_ID="$DEVICE" MEATGEEK_STATE_DIR="$dir" \
            apps/data-pusher/dist/simdevice --twin --count 0 --timeout 2m >/dev/null 2>"$dir.register.log"; then
            echo "registered $DEVICE"
          else
            echo "simdevice could not register device $DEVICE with DPS:" >&2
            cat "$dir.register.log" >&2
            exit 1
          fi

      # HAR-139: simdevice runs in DPS mode as the web device, with the state
      # dir the step above made; the runner hands it no credential. The
      # password and TOTP secret are repository secrets, which GitHub masks.
      - name: Run the live browser proof
        env:
          WEB_BASE_URL: https://meatgeekv2-web.vercel.app
          EXPECTED_WEB_SHA: ${{ needs.deploy.outputs.sha }}
          ACCEPTANCE_USER_UPN: ${{ vars.ACCEPTANCE_USER_UPN }}
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_TOTP_SECRET: ${{ secrets.ACCEPTANCE_USER_TOTP_SECRET }}
          ACCEPTANCE_WEB_DEVICE_ID: ${{ needs.deploy.outputs.simulated_device_id }}-web
          ACCEPTANCE_DPS_ID_SCOPE: ${{ needs.deploy.outputs.dps_id_scope }}
        run: |
          set -euo pipefail
          export ACCEPTANCE_WEB_STATE_DIR="$RUNNER_TEMP/devices/$ACCEPTANCE_WEB_DEVICE_ID"
          export ACCEPTANCE_SIMDEVICE_BIN="$GITHUB_WORKSPACE/apps/data-pusher/dist/simdevice"

          npx nx e2e-live web-e2e 2>&1 | tee "$RUNNER_TEMP/web-acceptance.log"

      # Proof step results, the two METRIC lines and Playwright's summary line,
      # also in the run summary.
      - name: Write the web acceptance summary
        if: always()
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/web-acceptance.log"
          {
            echo "## Live browser proof — production web app"
            echo
            echo "Commit \`$SHA\`, https://meatgeekv2-web.vercel.app"
            echo
            if [ -s "$LOG" ]; then
              echo '```'
              # PASS/FAIL/SKIP lines (live/step-reporter.ts), METRIC lines
              # (e.g. `METRIC web-push-ms 1840`), and Playwright's own
              # "1 passed (3.1m)" style summary. Colour codes stripped.
              sed -E 's/\x1b\[[0-9;]*m//g' "$LOG" | grep -E \
                '^(PASS|FAIL|SKIP) |^METRIC |^ *[0-9]+ (passed|failed|flaky|skipped|interrupted|did not run)' || true
              echo '```'
            else
              echo "The proof produced no output; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The HAR-44-style leak check (.github/scripts/web-acceptance-leak-check.cjs),
      # over this job's raw proof output (the file tee wrote, before GitHub's
      # masking, so a masked secret is still caught) and every sign-in
      # diagnostic the proof wrote (HAR-121): no connection-string key field,
      # no password, no TOTP secret, no TOTP code from any 30 s window the
      # job can have run in (the 30 min timeout, plus a margin), no claim
      # code (HAR-138), and no PEM private key block or JSON claim-code value
      # (HAR-139). Line numbers
      # only; nothing found is printed. HAR-126: it runs BEFORE the upload
      # below and deletes every diagnostic with a finding, so the upload
      # cannot include one. Exit 0 is clean, 1 is a finding (handled), 2 is a
      # check that could not finish or delete; `checked` is set only on 0 or
      # 1, and the upload needs it.
      - name: Check the proof's output and sign-in diagnostics for leaked secrets
        id: leak-check
        if: always()
        env:
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_TOTP_SECRET: ${{ secrets.ACCEPTANCE_USER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          rc=0
          node .github/scripts/web-acceptance-leak-check.cjs \
            "$RUNNER_TEMP/web-acceptance.log" \
            'dist/.playwright/web-e2e-live/test-results/**/sign-in-diagnostic.txt' || rc=$?
          if [ "$rc" -le 1 ]; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # On failure: the proof's own failure screenshot, taken only after
      # sign-in (the sign-in pages show the UPN and what was typed), and the
      # sign-in diagnostic, which names which of Microsoft's selectors were on
      # the page and holds no typed value, cookie or query string. Trace,
      # video and Playwright's failure screenshot and page snapshot are off
      # (playwright.live.config.ts); the globs keep this to those two even
      # so. Only after the leak check above finished: a diagnostic it found
      # anything in is already deleted, and if it could not finish nothing is
      # uploaded.
      - name: Upload the proof's failure screenshots and sign-in diagnostics
        if: failure() && steps.leak-check.outputs.checked == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-acceptance-diagnostics
          path: |
            dist/.playwright/web-e2e-live/test-results/**/*.png
            dist/.playwright/web-e2e-live/test-results/**/sign-in-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 7

  # HAR-169 (goal HAR-157): the live iOS proof, the web proof's twin. The real
  # app (apps/ios), built for an iPhone simulator, signs in as the acceptance
  # user through Microsoft's real pages with a TOTP code, claims the iOS
  # device <simulated_device_id>-ios with the code it reports, starts a cook
  # on it, sees a reading simdevice pushed, stops the cook and releases the
  # device (apps/ios/MeatGeekLiveUITests, run by
  # apps/ios/scripts/run-live-proof.sh).
  #
  # AFTER web-acceptance, pass or fail, never alongside it: both sign in as the
  # same acceptance user with a TOTP code, and Microsoft refuses a code that
  # was already used. Skipped when the deploy job published nothing, and when
  # the run was cancelled.
  ios-acceptance:
    needs: [deploy, web-acceptance]
    if: ${{ !cancelled() && needs.deploy.outputs.deployed == 'true' }}
    runs-on: macos-26
    # The app's first build (packages, the OpenAPI generator) is most of it.
    timeout-minutes: 45
    environment: development
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.deploy.outputs.sha }}
          persist-credentials: false

      # As ci.yml's ios job.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      # The leak check needs otplib, from the lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Enable corepack (use packageManager-pinned npm)
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      # simdevice (HAR-40) sends the readings the app must show.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/data-pusher/go.mod
          # As the acceptance job: modules from CI's cache, not the proxy.
          cache: false

      - name: Restore the Go module cache from CI
        id: gocache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: Linux-go-${{ hashFiles('**/go.sum') }}

      - name: Build simdevice
        env:
          GO_CACHE_HIT: ${{ steps.gocache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$GO_CACHE_HIT" = "true" ]; then
            export GOPROXY=off
          else
            echo "::warning title=simdevice::No Go module cache from ci.yml's build-go for this go.sum: downloading every module from proxy.golang.org."
          fi
          make -C apps/data-pusher build
          test -x apps/data-pusher/dist/simdevice

      # As ci.yml's ios job, keyed on the committed Package.resolved.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/ios/**/Package.resolved') }}

      # Only to manage the iOS device in IoT Hub and DPS: the proof calls the
      # API as the acceptance user, through the app, not as this identity.
      - name: Azure login (OIDC — dev app-publish identity)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_APP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Pinned, never latest. Gives `az iot hub device-identity` and
      # `az iot dps enrollment`, which enrol-device.sh calls.
      - name: Install the azure-iot CLI extension
        run: az extension add --name azure-iot --version 1.0.0 --yes

      # The fourth standing device, <simulated_device_id>-ios, the proof's own:
      # the same migration, `identity init`, enrol-device.sh and registration,
      # with the same flags and reasons, as web-acceptance's step for -web
      # (HAR-139). The proof claims it through the app; this only gives it its
      # identity.
      - name: Enrol the iOS device through DPS
        env:
          HUB: ${{ needs.deploy.outputs.iot_hub_hostname }}
          DPS_HOST: ${{ needs.deploy.outputs.dps_name }}.azure-devices-provisioning.net
          DEVICE: ${{ needs.deploy.outputs.simulated_device_id }}-ios
          MEATGEEK_DPS_ID_SCOPE: ${{ needs.deploy.outputs.dps_id_scope }}
        run: |
          set -euo pipefail
          err="$RUNNER_TEMP/ios-device-auth.err" rc=0
          auth="$(az iot hub device-identity show --hub-name "$HUB" --device-id "$DEVICE" \
            --auth-type login --query authentication.type -o tsv 2>"$err")" || rc=$?
          if [ "$rc" -eq 0 ] && [ "$auth" = "sas" ]; then
            az iot hub device-identity delete --hub-name "$HUB" --device-id "$DEVICE" \
              --auth-type login -o none >/dev/null
            echo "migrated $DEVICE"
          elif [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || grep -q 'DeviceNotFound' "$err"; then
            echo "ok $DEVICE"
          else
            echo "az iot hub device-identity show for device $DEVICE failed (exit $rc), and not because the device is missing:" >&2
            cat "$err" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/devices/$DEVICE"
          mkdir -p "$RUNNER_TEMP/devices"
          apps/data-pusher/dist/simdevice identity init --device-id "$DEVICE" \
            --state-dir "$dir" > "$dir.pem"
          apps/data-pusher/deploy/enrol-device.sh --device-id "$DEVICE" \
            --certificate "$dir.pem" --auth-type login \
            --dps "$DPS_HOST" --hub "$HUB"
          if MEATGEEK_DEVICE_ID="$DEVICE" MEATGEEK_STATE_DIR="$dir" \
            apps/data-pusher/dist/simdevice --twin --count 0 --timeout 2m >/dev/null 2>"$dir.register.log"; then
            echo "registered $DEVICE"
          else
            echo "simdevice could not register device $DEVICE with DPS:" >&2
            cat "$dir.register.log" >&2
            exit 1
          fi

      # The runner reads the claim code, makes a throwaway simulator, builds,
      # sends readings in the background for the length of the test and stops
      # them on exit. The password and TOTP secret are repository secrets,
      # which GitHub masks; the runner hands them to xcodebuild only as
      # TEST_RUNNER_* variables, never on a command line. Its raw output goes
      # to a file, NOT to this log: an XCTest failure can print a screen's
      # elements, and a TOTP code or claim code is not something GitHub masks.
      # Only the PASS/FAIL/SKIP, METRIC and runner lines are printed here; the
      # whole log is printed further down once the leak check has passed it.
      - name: Run the live iOS proof
        env:
          ACCEPTANCE_USER_UPN: ${{ vars.ACCEPTANCE_USER_UPN }}
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_TOTP_SECRET: ${{ secrets.ACCEPTANCE_USER_TOTP_SECRET }}
          ACCEPTANCE_IOS_DEVICE_ID: ${{ needs.deploy.outputs.simulated_device_id }}-ios
          ACCEPTANCE_DPS_ID_SCOPE: ${{ needs.deploy.outputs.dps_id_scope }}
        run: |
          set -euo pipefail
          export ACCEPTANCE_IOS_STATE_DIR="$RUNNER_TEMP/devices/$ACCEPTANCE_IOS_DEVICE_ID"
          export ACCEPTANCE_SIMDEVICE_BIN="$GITHUB_WORKSPACE/apps/data-pusher/dist/simdevice"
          export ACCEPTANCE_RUN_ID="$GITHUB_RUN_ID"
          export IOS_LIVE_RESULT_BUNDLE="$RUNNER_TEMP/ios-acceptance.xcresult"
          export IOS_LIVE_DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          LOG="$RUNNER_TEMP/ios-acceptance.log"
          rc=0
          apps/ios/scripts/run-live-proof.sh > "$LOG" 2>&1 || rc=$?
          grep -E '^(PASS|FAIL|SKIP) |^METRIC |^run-live-proof: |^ *Executed [0-9]+ tests?' "$LOG" || true
          exit "$rc"

      # Proof step results and the METRIC line, also in the run summary.
      - name: Write the iOS acceptance summary
        if: always()
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/ios-acceptance.log"
          {
            echo "## Live iOS proof — the app in the simulator, against dev"
            echo
            echo "Commit \`$SHA\`"
            echo
            if [ -s "$LOG" ]; then
              echo '```'
              # PASS/FAIL/SKIP lines (MeatGeekLiveUITests/LiveDriver.swift,
              # LiveSteps) and `METRIC ios-push-ms <n>`.
              grep -E '^(PASS|FAIL|SKIP) |^METRIC ' "$LOG" || true
              echo '```'
            else
              echo "The proof produced no output; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the screenshots the proof itself takes, by name: 1-devices-tab,
      # 2-cook-pushed-reading (the proof), 3-cook-ended, and failure (only
      # before Microsoft's sign-in sheet is open or once signed in, never of
      # the claim form). XCTest also attaches text
      # dumps of the screen's elements, which can hold a field's value; those
      # are never copied out of the result bundle, and the bundle is never
      # uploaded. On success the pushed-reading screenshot must be there.
      - name: Export the proof's screenshots
        if: always()
        env:
          PROOF_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/ios-acceptance.xcresult"
          OUT="$RUNNER_TEMP/ios-acceptance-screenshots"
          mkdir -p "$OUT"
          if [ ! -d "$BUNDLE" ]; then
            echo "No result bundle: the proof did not get as far as testing."
            exit 0
          fi
          ALL="$(mktemp -d)"
          xcrun xcresulttool export attachments --path "$BUNDLE" --output-path "$ALL" >/dev/null
          /usr/bin/python3 -I - "$ALL" "$OUT" <<'PY'
          import json, os, re, shutil, sys
          src, out = sys.argv[1], sys.argv[2]
          names = ("1-devices-tab", "2-cook-pushed-reading", "3-cook-ended", "failure")
          for test in json.load(open(os.path.join(src, "manifest.json"))):
              for a in test.get("attachments", []):
                  name = re.sub(r"_\d+_[0-9A-F-]{36}\.png$", "", a.get("suggestedHumanReadableName", ""))
                  if name in names and a["exportedFileName"].endswith(".png"):
                      shutil.copyfile(os.path.join(src, a["exportedFileName"]), os.path.join(out, name + ".png"))
                      print(f"screenshot: {name}.png")
          PY
          rm -rf "$ALL"
          if [ "$PROOF_OUTCOME" = "success" ] && [ ! -f "$OUT/2-cook-pushed-reading.png" ]; then
            echo "The proof passed but its pushed-reading screenshot is not in the result bundle." >&2
            exit 1
          fi

      # The HAR-44-style leak check (.github/scripts/web-acceptance-leak-check.cjs)
      # over the runner's raw output (before GitHub's masking, so a masked
      # secret is still caught): no connection-string key field, password,
      # TOTP secret, TOTP code from any 30 s window the job can have run in,
      # claim code, PEM private key block or JSON claim-code value. Line
      # numbers only. It runs BEFORE the upload and the log below; exit 0 is
      # clean, 1 a finding, 2 a check that could not finish. `checked` is set
      # only on 0 or 1, and the upload needs it; the log is printed only on 0.
      - name: Check the proof's output for leaked secrets
        id: leak-check
        if: always()
        env:
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_TOTP_SECRET: ${{ secrets.ACCEPTANCE_USER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          rc=0
          node .github/scripts/web-acceptance-leak-check.cjs "$RUNNER_TEMP/ios-acceptance.log" || rc=$?
          if [ "$rc" -le 1 ]; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Print the proof's full output (the leak check found nothing in it)
        if: always() && steps.leak-check.outcome == 'success'
        run: |
          LOG="$RUNNER_TEMP/ios-acceptance.log"
          if [ -f "$LOG" ]; then cat "$LOG"; else echo "No output: the proof did not run."; fi

      # On success too: goal HAR-157 needs the screenshots. Screenshots only
      # (see the export step), and only once the leak check has finished.
      - name: Upload the proof's screenshots
        if: always() && steps.leak-check.outputs.checked == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-acceptance-screenshots
          path: ${{ runner.temp }}/ios-acceptance-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
