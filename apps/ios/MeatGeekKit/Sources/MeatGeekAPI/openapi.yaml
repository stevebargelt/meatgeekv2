      summary: List the caller's cooks
      description: |
        Returns one page of the authenticated caller's cooks as a
        CookListResponse: a bare cook array under `cooks` with `limit`,
        `hasMore` and `continuationToken`. Newest first; paged by continuation
        token, never offset. Each cook carries only Cook contract fields.

        Filters (MG-87): `deviceId` and `status` narrow the list and combine
        with AND, so `?deviceId=<id>&status=active` returns only the caller's
        active cook on that device. Neither can widen the query beyond the
        caller's own cooks. An invalid filter is 400 VALIDATION_ERROR before any
        read.

        There is no `userId` parameter: a `userId` in the query is ignored.

        Every response carries X-Request-ID: the caller's `X-Request-ID` when
        sent, else the invocation id (HAR-75).
